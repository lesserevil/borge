services:
  flutter:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
      - flutter-gradle-cache:/root/.gradle
      - ${HOME}/.android:/root/.android
    working_dir: /workspace
    stdin_open: true
    tty: true

  flutter-usb:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - flutter-pub-cache:/root/.pub-cache
      - flutter-gradle-cache:/root/.gradle
      - ${HOME}/.android:/root/.android
      - /dev/bus/usb:/dev/bus/usb
    working_dir: /workspace
    privileged: true
    stdin_open: true
    tty: true

  pebble:
    build:
      context: .
      dockerfile: Dockerfile.pebble
    volumes:
      - .:/workspace
    working_dir: /workspace/pebble
    stdin_open: true
    tty: true

volumes:
  flutter-pub-cache:
    name: borge-pub-cache
  flutter-gradle-cache:
    name: borge-gradle-cache
