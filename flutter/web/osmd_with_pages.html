<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSMD with Page Size</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        #controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
        }

        #controls button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #controls button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        #info {
            margin-left: auto;
        }

        #scroll-container {
            margin-top: 70px;
            height: calc(100vh - 70px);
            overflow-x: hidden;
            overflow-y: hidden;
            /* No scrollbar - users navigate via Prev/Next buttons */
            display: flex;
            flex-direction: column;
            /* Changed from row to column for vertical layout */
            align-items: center;
            padding: 20px;
        }

        #osmd-container {
            width: 100%;
            /* Match viewport width instead of fixed 1200px */
            max-width: 100%;
        }
    </style>
</head>

<body>
    <div id="controls">
        <button onclick="loadScore()">Load Score</button>
        <button id="prev" onclick="prevPage()" disabled>← Prev</button>
        <button id="next" onclick="nextPage()" disabled>Next →</button>
        <button id="zoom-out" onclick="zoomOut()" disabled>🔍−</button>
        <button id="zoom-in" onclick="zoomIn()" disabled>🔍+</button>
        <span id="info">Ready</span>
    </div>

    <div id="scroll-container">
        <div id="osmd-container"></div>
    </div>

    <script>
        let osmd = null;
        let currentPage = 1;
        let totalPages = 1;
        let zoomLevel = 1.0; // Default zoom level

        async function init() {
            try {
                // Create OSMD with page format options
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('osmd-container', {
                    autoResize: false,
                    backend: 'svg',
                    drawTitle: true,
                    drawComposer: true,
                    drawSubtitle: true,
                });

                console.log('OSMD initialized');
            } catch (error) {
                console.error('Init error:', error);
            }
        }

        async function loadScore() {
            try {
                document.getElementById('info').textContent = 'Loading...';

                const response = await fetch('sample_score.xml');
                const xml = await response.text();

                await osmd.load(xml);

                // DYNAMIC VIEWPORT-BASED PAGE FORMAT
                // Calculate page size from viewport/container dimensions
                const container = document.getElementById('scroll-container');
                const containerWidth = container.clientWidth - 40; // Account for padding
                const containerHeight = container.clientHeight - 40;

                // Convert pixels to millimeters for PageFormat
                // Standard: 96 DPI, 1 inch = 25.4mm
                const pixelsToMm = (pixels) => pixels * 25.4 / 96;

                const pageWidthMm = pixelsToMm(containerWidth);
                const pageHeightMm = pixelsToMm(containerHeight);

                console.log(`Viewport: ${containerWidth}x${containerHeight}px`);
                console.log(`PageFormat: ${pageWidthMm.toFixed(1)}x${pageHeightMm.toFixed(1)}mm`);

                // Create custom PageFormat matching viewport
                osmd.rules.PageFormat = new opensheetmusicdisplay.PageFormat(
                    pageWidthMm,
                    pageHeightMm,
                    "Viewport"  // Custom name
                );

                // Apply zoom level
                osmd.zoom = zoomLevel;

                await osmd.render();

                // Count pages
                totalPages = osmd.GraphicSheet?.MusicPages?.length || 1;
                const measureCount = osmd.Sheet?.SourceMeasures?.length || 0;

                console.log(`✅ Native Pagination: ${totalPages} pages, ${measureCount} measures, zoom: ${zoomLevel}x`);
                console.log(`PageHeight: ${osmd.EngravingRules.PageHeight.toFixed(1)} (calculated from viewport)`);

                document.getElementById('info').textContent =
                    `Page ${currentPage} of ${totalPages} (${measureCount} measures)`;

                if (totalPages > 1) {
                    document.getElementById('next').disabled = false;
                }

                // Enable zoom buttons
                document.getElementById('zoom-in').disabled = false;
                document.getElementById('zoom-out').disabled = false;

                scrollToPage(1);

            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('info').textContent = 'Error: ' + error.message;
            }
        }

        function scrollToPage(pageNum) {
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            if (pages.length === 0 || pageNum < 1 || pageNum > pages.length) return;

            const targetPage = pages[pageNum - 1];
            const container = document.getElementById('scroll-container');

            // OSMD stacks pages VERTICALLY, not horizontally
            // Calculate vertical scroll position relative to container
            const containerRect = container.getBoundingClientRect();
            const pageRect = targetPage.getBoundingClientRect();
            const scrollTop = pageRect.top - containerRect.top + container.scrollTop;

            container.scrollTo({
                top: scrollTop,
                behavior: 'smooth'
            });

            currentPage = pageNum;
            document.getElementById('info').textContent =
                `Page ${currentPage} of ${totalPages}`;

            document.getElementById('prev').disabled = currentPage <= 1;
            document.getElementById('next').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                scrollToPage(currentPage - 1);
            }
        }


        function nextPage() {
            if (currentPage < totalPages) {
                scrollToPage(currentPage + 1);
            }
        }

        // Get first visible measure number using OSMD internal API
        function getFirstVisibleMeasure() {
            const pageIndex = (currentPage || 1) - 1;

            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return 1;
            }

            const page = osmd.GraphicSheet.musicPages[pageIndex];
            if (page && page.musicSystems && page.musicSystems.length > 0) {
                const system = page.musicSystems[0];
                if (system.graphicalMeasures && system.graphicalMeasures.length > 0) {
                    const measure = system.graphicalMeasures[0][0];
                    return measure.parentSourceMeasure?.measureNumber || 1;
                }
            }

            return 1;
        }

        // Find which page contains a specific measure using OSMD internal API
        function findPageWithMeasure(measureNumber) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return 1;
            }

            const pages = osmd.GraphicSheet.musicPages;

            // Search for exact match first
            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                for (const system of page.musicSystems) {
                    for (const measureArray of system.graphicalMeasures) {
                        const m = measureArray[0];
                        const measureNum = m.parentSourceMeasure?.measureNumber;
                        if (measureNum === measureNumber) {
                            return i + 1; // pages are 1-indexed
                        }
                    }
                }
            }

            // If no exact match, find first page with measure >= target
            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                for (const system of page.musicSystems) {
                    for (const measureArray of system.graphicalMeasures) {
                        const m = measureArray[0];
                        const measureNum = m.parentSourceMeasure?.measureNumber;
                        if (measureNum >= measureNumber) {
                            return i + 1;
                        }
                    }
                }
            }

            return pages.length; // fallback to last page
        }

        // Handle window resize with debouncing
        let resizeTimeout;
        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(async () => {
                if (!osmd || !osmd.Sheet) return;

                console.log('Window resized, re-rendering...');

                // Remember current position
                const firstVisibleMeasure = getFirstVisibleMeasure();
                console.log(`First visible measure before resize: ${firstVisibleMeasure}`);

                // Re-render with new viewport dimensions
                await loadScore();

                // Navigate to page containing the original measure
                const targetPage = findPageWithMeasure(firstVisibleMeasure);
                console.log(`Navigating to page ${targetPage} (contains measure ${firstVisibleMeasure})`);
                scrollToPage(targetPage);
            }, 500); // 500ms debounce
        }

        // Zoom In: Increase zoom by 0.1, maintain measure position
        async function zoomIn() {
            if (!osmd || !osmd.Sheet) return;

            // Remember current position
            const firstVisibleMeasure = getFirstVisibleMeasure();
            console.log(`Zooming in from ${zoomLevel}x, current measure: ${firstVisibleMeasure}`);

            // Increase zoom (max 2.0x)
            zoomLevel = Math.min(2.0, zoomLevel + 0.1);

            // Re-render with new zoom
            await loadScore();

            // Navigate to page containing the original measure
            const targetPage = findPageWithMeasure(firstVisibleMeasure);
            console.log(`After zoom in to ${zoomLevel}x: navigating to page ${targetPage}`);
            scrollToPage(targetPage);
        }

        // Zoom Out: Decrease zoom by 0.1, maintain measure position
        async function zoomOut() {
            if (!osmd || !osmd.Sheet) return;

            // Remember current position
            const firstVisibleMeasure = getFirstVisibleMeasure();
            console.log(`Zooming out from ${zoomLevel}x, current measure: ${firstVisibleMeasure}`);

            // Decrease zoom (min 0.5x)
            zoomLevel = Math.max(0.5, zoomLevel - 0.1);

            // Re-render with new zoom
            await loadScore();

            // Navigate to page containing the original measure
            const targetPage = findPageWithMeasure(firstVisibleMeasure);
            console.log(`After zoom out to ${zoomLevel}x: navigating to page ${targetPage}`);
            scrollToPage(targetPage);
        }

        window.addEventListener('load', init);
        window.addEventListener('resize', handleResize);
    </script>
</body>

</html>
