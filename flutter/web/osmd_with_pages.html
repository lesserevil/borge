<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSMD with Page Size</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        #controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
        }

        #controls button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #controls button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        #info {
            margin-left: auto;
        }

        #scroll-container {
            margin-top: 70px;
            height: calc(100vh - 70px);
            overflow-x: hidden;
            overflow-y: auto;
            /* Changed from hidden to auto for vertical scrolling */
            display: flex;
            flex-direction: column;
            /* Changed from row to column for vertical layout */
            align-items: center;
            padding: 20px;
        }

        #osmd-container {
            width: 100%;
            /* Match viewport width instead of fixed 1200px */
            max-width: 100%;
        }
    </style>
</head>

<body>
    <div id="controls">
        <button onclick="loadScore()">Load Score</button>
        <button id="prev" onclick="prevPage()" disabled>← Prev</button>
        <button id="next" onclick="nextPage()" disabled>Next →</button>
        <span id="info">Ready</span>
    </div>

    <div id="scroll-container">
        <div id="osmd-container"></div>
    </div>

    <script>
        let osmd = null;
        let currentPage = 1;
        let totalPages = 1;

        async function init() {
            try {
                // Create OSMD with page format options
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('osmd-container', {
                    autoResize: false,
                    backend: 'svg',
                    drawTitle: true,
                    drawComposer: true,
                    drawSubtitle: true,
                });

                console.log('OSMD initialized');
            } catch (error) {
                console.error('Init error:', error);
            }
        }

        async function loadScore() {
            try {
                document.getElementById('info').textContent = 'Loading...';

                const response = await fetch('sample_score.xml');
                const xml = await response.text();

                await osmd.load(xml);

                // DYNAMIC VIEWPORT-BASED PAGE FORMAT
                // Calculate page size from viewport/container dimensions
                const container = document.getElementById('scroll-container');
                const containerWidth = container.clientWidth - 40; // Account for padding
                const containerHeight = container.clientHeight - 40;

                // Convert pixels to millimeters for PageFormat
                // Standard: 96 DPI, 1 inch = 25.4mm
                const pixelsToMm = (pixels) => pixels * 25.4 / 96;

                const pageWidthMm = pixelsToMm(containerWidth);
                const pageHeightMm = pixelsToMm(containerHeight);

                console.log(`Viewport: ${containerWidth}x${containerHeight}px`);
                console.log(`PageFormat: ${pageWidthMm.toFixed(1)}x${pageHeightMm.toFixed(1)}mm`);

                // Create custom PageFormat matching viewport
                osmd.rules.PageFormat = new opensheetmusicdisplay.PageFormat(
                    pageWidthMm,
                    pageHeightMm,
                    "Viewport"  // Custom name
                );

                await osmd.render();

                // Count pages
                totalPages = osmd.GraphicSheet?.MusicPages?.length || 1;
                const measureCount = osmd.Sheet?.SourceMeasures?.length || 0;

                console.log(`✅ Native Pagination: ${totalPages} pages, ${measureCount} measures`);
                console.log(`PageHeight: ${osmd.EngravingRules.PageHeight.toFixed(1)} (calculated from viewport)`);

                document.getElementById('info').textContent =
                    `Page ${currentPage} of ${totalPages} (${measureCount} measures)`;

                if (totalPages > 1) {
                    document.getElementById('next').disabled = false;
                }

                scrollToPage(1);

            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('info').textContent = 'Error: ' + error.message;
            }
        }

        function scrollToPage(pageNum) {
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            if (pages.length === 0 || pageNum < 1 || pageNum > pages.length) return;

            const targetPage = pages[pageNum - 1];
            const container = document.getElementById('scroll-container');

            // OSMD stacks pages VERTICALLY, not horizontally
            // Calculate vertical scroll position relative to container
            const containerRect = container.getBoundingClientRect();
            const pageRect = targetPage.getBoundingClientRect();
            const scrollTop = pageRect.top - containerRect.top + container.scrollTop;

            container.scrollTo({
                top: scrollTop,
                behavior: 'smooth'
            });

            currentPage = pageNum;
            document.getElementById('info').textContent =
                `Page ${currentPage} of ${totalPages}`;

            document.getElementById('prev').disabled = currentPage <= 1;
            document.getElementById('next').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                scrollToPage(currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                scrollToPage(currentPage + 1);
            }
        }

        window.addEventListener('load', init);
    </script>
</body>

</html>
