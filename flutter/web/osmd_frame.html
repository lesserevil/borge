<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicXML Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 40px;
            scroll-behavior: smooth;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #f8f9fa;
        }

        #osmd-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            min-width: 100%;
            /* Ensure OSMD has width to work with */
        }

        /* Style the pages for a premium look */
        div[id^="osmdCanvasPage"] {
            background-color: white !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            border: 1px solid #e0e0e0 !important;
            margin: 0 40px !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0 !important;
            position: relative !important;
        }

        /* Annotation canvas overlay - sits on top of each OSMD page */
        .annotation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }

        .annotation-canvas.drawing-mode {
            pointer-events: auto;
            cursor: crosshair;
        }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            padding: 20px;
            color: #c0392b;
            text-align: center;
        }

        #error.visible {
            display: block;
        }

        /* OSMD styling overrides */
        .osmd-container svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <span>Loading sheet music...</span>
        </div>
        <div id="error"></div>
        <div id="osmd-container"></div>
    </div>

    <script>
        // Global state
        let osmd = null;
        let isReady = false;
        let pendingMusicXml = null;
        let frameId = null;

        // Pagination state
        let originalMusicXml = null;
        let paginationInfo = null;
        let currentPageNumber = 1;

        // ── Annotation State ──────────────────────────────────────────
        let annotationEnabled = false;
        let isDrawing = false;
        let currentStrokePoints = [];
        let annotationCanvases = new Map();
        let storedAnnotations = new Map();
        let strokeColor = '#1A3A6B';
        let strokeWidth = 2.5;

        // ── Undo/Redo History Stack ───────────────────────────────────
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 100;

        // ── Annotation Canvas Management ──────────────────────────────

        /** Remove all tracked annotation canvases from the DOM and clear the map */
        function teardownAnnotationCanvases() {
            for (const [, canvas] of annotationCanvases) {
                canvas.remove();
            }
            annotationCanvases.clear();
        }

        function getOrCreateAnnotationCanvas(pageDiv, pageIndex) {
            if (annotationCanvases.has(pageIndex)) {
                const existing = annotationCanvases.get(pageIndex);
                if (existing.width !== pageDiv.clientWidth || existing.height !== pageDiv.clientHeight) {
                    existing.width = pageDiv.clientWidth;
                    existing.height = pageDiv.clientHeight;
                    redrawAnnotations(pageIndex);
                }
                return existing;
            }

            const canvas = document.createElement('canvas');
            canvas.className = 'annotation-canvas';
            canvas.width = pageDiv.clientWidth;
            canvas.height = pageDiv.clientHeight;

            if (annotationEnabled) {
                canvas.classList.add('drawing-mode');
            }

            canvas.addEventListener('pointerdown', (e) => onPointerDown(e, pageIndex));
            canvas.addEventListener('pointermove', (e) => onPointerMove(e, pageIndex));
            canvas.addEventListener('pointerup', (e) => onPointerUp(e, pageIndex));
            canvas.addEventListener('pointercancel', (e) => onPointerUp(e, pageIndex));

            pageDiv.appendChild(canvas);
            annotationCanvases.set(pageIndex, canvas);
            return canvas;
        }

        function setupAnnotationCanvases() {
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            pages.forEach((pageDiv, index) => {
                getOrCreateAnnotationCanvas(pageDiv, index);
            });

            for (const [pageIndex] of storedAnnotations) {
                redrawAnnotations(pageIndex);
            }
        }

        function setAnnotationModeInternal(enabled) {
            annotationEnabled = enabled;
            for (const [, canvas] of annotationCanvases) {
                if (enabled) {
                    canvas.classList.add('drawing-mode');
                } else {
                    canvas.classList.remove('drawing-mode');
                }
            }

            // When exiting drawing mode, convert all pixel-space annotations
            // to measure-relative coordinates for zoom/reflow resilience.
            if (!enabled) {
                convertAnnotationsToMeasureRelative();
            }

            sendToFlutter('annotationModeChanged', { enabled });
        }

        /**
         * Convert all annotations still in 'pixel' coord system to 'measure' coords.
         * Called once when exiting drawing mode.
         */
        function convertAnnotationsToMeasureRelative() {
            for (const [pageIndex, annotations] of storedAnnotations) {
                for (const ann of annotations) {
                    if (ann.coordSystem === 'measure') continue; // already converted

                    const mBBox = getMeasureBBox(ann.measureNumber, pageIndex);
                    if (!mBBox || mBBox.w <= 0 || mBBox.h <= 0) continue; // can't convert, leave as pixel

                    // Parse the pixel-space SVG path
                    const pixelPoints = svgPathToPoints(ann.svgPath);
                    if (pixelPoints.length < 2) continue;

                    // Convert each point to measure-relative (0-1 within measure bbox)
                    const relPoints = pixelPoints.map(p => ({
                        x: (p.x - mBBox.x) / mBBox.w,
                        y: (p.y - mBBox.y) / mBBox.h,
                    }));

                    // Use higher precision for normalized coords
                    ann.svgPath = pointsToSvgPathPrecise(relPoints);
                    ann.coordSystem = 'measure';

                    // Also update the midpoint x/y to measure-relative
                    const mid = relPoints[Math.floor(relPoints.length / 2)];
                    ann.x = mid.x;
                    ann.y = mid.y;
                }
            }
        }

        /**
         * Like pointsToSvgPath but with higher decimal precision for normalized coords.
         */
        function pointsToSvgPathPrecise(points) {
            if (points.length === 0) return '';
            let path = `M ${points[0].x.toFixed(4)} ${points[0].y.toFixed(4)}`;
            for (let i = 1; i < points.length; i++) {
                path += ` L ${points[i].x.toFixed(4)} ${points[i].y.toFixed(4)}`;
            }
            return path;
        }

        function setAnnotationStyleInternal(color, width) {
            if (color) strokeColor = color;
            if (width) strokeWidth = width;
        }

        // ── Pointer Event Handlers ────────────────────────────────────

        function onPointerDown(e, pageIndex) {
            if (!annotationEnabled) return;
            e.preventDefault();
            isDrawing = true;

            const canvas = annotationCanvases.get(pageIndex);
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            currentStrokePoints = [{ x, y }];

            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function onPointerMove(e, pageIndex) {
            if (!isDrawing || !annotationEnabled) return;
            e.preventDefault();

            const canvas = annotationCanvases.get(pageIndex);
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            currentStrokePoints.push({ x, y });

            const ctx = canvas.getContext('2d');
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function onPointerUp(e, pageIndex) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;

            if (currentStrokePoints.length < 2) {
                currentStrokePoints = [];
                return;
            }

            const canvas = annotationCanvases.get(pageIndex);
            const midPoint = currentStrokePoints[Math.floor(currentStrokePoints.length / 2)];
            const measureInfo = findMeasureAtPoint(midPoint.x, midPoint.y, pageIndex);

            // Store the raw pixel SVG path and the canvas size at draw time.
            // On redraw at a different size, we scale proportionally.
            const svgPath = pointsToSvgPath(currentStrokePoints);

            const annotation = {
                svgPath,
                measureNumber: measureInfo.measureNumber,
                x: midPoint.x / canvas.width,
                y: midPoint.y / canvas.height,
                color: strokeColor,
                width: strokeWidth,
                // Starts as pixel coords; converted to measure-relative on exit drawing mode
                coordSystem: 'pixel',
                origWidth: canvas.width,
                origHeight: canvas.height,
            };

            if (!storedAnnotations.has(pageIndex)) {
                storedAnnotations.set(pageIndex, []);
            }
            storedAnnotations.get(pageIndex).push(annotation);

            pushToUndoStack(pageIndex, annotation);

            sendToFlutter('annotationAdded', {
                pageIndex,
                measureNumber: measureInfo.measureNumber,
                svgPath,
                x: midPoint.x,
                y: midPoint.y,
                color: strokeColor,
                width: strokeWidth,
            });

            currentStrokePoints = [];
            redrawAnnotations(pageIndex);
        }

        // ── SVG Path Generation ───────────────────────────────────────

        function pointsToSvgPath(points) {
            if (points.length === 0) return '';
            let path = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 1; i < points.length; i++) {
                path += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
            }
            return path;
        }

        function svgPathToPoints(svgPath) {
            const points = [];
            const commands = svgPath.match(/[ML]\s*-?[\d.]+\s+-?[\d.]+/g);
            if (!commands) return points;
            for (const cmd of commands) {
                const nums = cmd.match(/-?[\d.]+/g);
                if (nums && nums.length >= 2) {
                    points.push({ x: parseFloat(nums[0]), y: parseFloat(nums[1]) });
                }
            }
            return points;
        }

        // ── Measure Coordinate Tracking (DOM-based) ─────────────────────

        /**
         * Get the bounding box of a measure in pixel coordinates
         * relative to its page div container.
         * Uses the DOM: .vf-measure elements with id matching the measure number.
         * Returns {x, y, w, h} or null if not found.
         */
        function getMeasureBBox(measureNumber, pageIndex) {
            const pageDiv = document.querySelectorAll('div[id^="osmdCanvasPage"]')[pageIndex];
            if (!pageDiv) return null;

            // OSMD renders .vf-measure elements with id = measure number
            const measureEl = pageDiv.querySelector(`.vf-measure[id="${measureNumber}"]`);
            if (!measureEl) return null;

            const measureRect = measureEl.getBoundingClientRect();
            const pageRect = pageDiv.getBoundingClientRect();

            return {
                x: measureRect.left - pageRect.left,
                y: measureRect.top - pageRect.top,
                w: measureRect.width,
                h: measureRect.height,
            };
        }

        /**
         * Find which measure is closest to a point (in page-div-relative pixel coords).
         */
        function findMeasureAtPoint(px, py, pageIndex) {
            const pageDiv = document.querySelectorAll('div[id^="osmdCanvasPage"]')[pageIndex];
            if (!pageDiv) return { measureNumber: 1 };

            const measures = pageDiv.querySelectorAll('.vf-measure');
            if (!measures.length) return { measureNumber: 1 };

            const pageRect = pageDiv.getBoundingClientRect();
            let closestMeasure = 1;
            let closestDistance = Infinity;

            for (const el of measures) {
                const rect = el.getBoundingClientRect();
                const cx = (rect.left + rect.width / 2) - pageRect.left;
                const cy = (rect.top + rect.height / 2) - pageRect.top;

                const dist = Math.sqrt((px - cx) ** 2 + (py - cy) ** 2);
                if (dist < closestDistance) {
                    closestDistance = dist;
                    closestMeasure = parseInt(el.id, 10) || 1;
                }
            }

            return { measureNumber: closestMeasure };
        }

        // ── Annotation Rendering ──────────────────────────────────────

        function redrawAnnotations(pageIndex) {
            const canvas = annotationCanvases.get(pageIndex);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const annotations = storedAnnotations.get(pageIndex);
            if (!annotations) return;

            for (const ann of annotations) {

                if (ann.type === 'structured' && ann.kind && STRUCTURED_SYMBOLS[ann.kind]) {
                    const px = ann.x * canvas.width;
                    const py = ann.y * canvas.height;
                    STRUCTURED_SYMBOLS[ann.kind].render(ctx, px, py, ann.data || {});
                } else if (ann.svgPath) {
                    if (ann.coordSystem === 'measure') {
                        // Measure-relative: look up current measure position and scale
                        const mBBox = getMeasureBBox(ann.measureNumber, pageIndex);
                        if (mBBox) {
                            drawSvgPathMeasureRelative(ctx, ann.svgPath, strokeColor, ann.width || strokeWidth, mBBox);
                        }
                    } else {
                        // Pixel coords: scale proportionally from original canvas size
                        const scaleX = ann.origWidth ? canvas.width / ann.origWidth : 1;
                        const scaleY = ann.origHeight ? canvas.height / ann.origHeight : 1;
                        drawSvgPathScaled(ctx, ann.svgPath, strokeColor, ann.width || strokeWidth, scaleX, scaleY);
                    }
                }
            }
        }

        /**
         * Draw an SVG path with proportional scaling.
         * Points in the path are in original pixel coordinates;
         * scaleX/scaleY transform them to current canvas size.
         */
        function drawSvgPathScaled(ctx, svgPath, color, width, scaleX, scaleY) {
            const points = svgPathToPoints(svgPath);
            if (points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(points[0].x * scaleX, points[0].y * scaleY);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x * scaleX, points[i].y * scaleY);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        /**
         * Draw an SVG path stored in measure-relative coordinates.
         * Points are offsets within the measure bbox (0-1 range).
         * Scaled to the measure's current pixel position.
         */
        function drawSvgPathMeasureRelative(ctx, svgPath, color, width, mBBox) {
            const points = svgPathToPoints(svgPath);
            if (points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(mBBox.x + points[0].x * mBBox.w, mBBox.y + points[0].y * mBBox.h);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(mBBox.x + points[i].x * mBBox.w, mBBox.y + points[i].y * mBBox.h);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function loadAnnotationsInternal(annotations) {
            storedAnnotations.clear();
            for (const ann of annotations) {
                const pi = ann.pageIndex || 0;
                if (!storedAnnotations.has(pi)) {
                    storedAnnotations.set(pi, []);
                }
                // Legacy annotations from DB lack coordSystem and origWidth/origHeight.
                // Tag them so the proportional scaler can use current canvas size.
                if (!ann.coordSystem) {
                    const canvas = annotationCanvases.get(pi);
                    ann.coordSystem = 'pixel';
                    ann.origWidth = canvas ? canvas.width : null;
                    ann.origHeight = canvas ? canvas.height : null;
                }
                storedAnnotations.get(pi).push(ann);
            }

            // Convert loaded pixel annotations to measure-relative immediately
            // so they survive future zoom/resize.
            convertAnnotationsToMeasureRelative();

            for (const [pi] of storedAnnotations) {
                redrawAnnotations(pi);
            }
        }

        function clearAnnotationsInternal(pageIndex) {
            if (pageIndex !== undefined && pageIndex !== null) {
                storedAnnotations.delete(pageIndex);
                redrawAnnotations(pageIndex);
            } else {
                storedAnnotations.clear();
                for (const [pi] of annotationCanvases) {
                    redrawAnnotations(pi);
                }
            }
            sendToFlutter('annotationsCleared', { pageIndex: pageIndex ?? -1 });
        }

        function removeLastAnnotationInternal(pageIndex) {
            const annotations = storedAnnotations.get(pageIndex);
            if (annotations && annotations.length > 0) {
                const removed = annotations.pop();
                redrawAnnotations(pageIndex);
                sendToFlutter('annotationRemoved', {
                    pageIndex,
                    measureNumber: removed.measureNumber,
                    remaining: annotations.length,
                });
            }
        }

        // ── Structured Annotation Symbols ─────────────────────────────

        const STRUCTURED_SYMBOLS = {
            fingerNumber: {
                render: (ctx, x, y, data) => {
                    const num = data.value || '1';
                    ctx.font = 'bold 16px serif';
                    ctx.fillStyle = data.color || '#0066CC';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, x, y);
                },
            },
            dynamicMark: {
                render: (ctx, x, y, data) => {
                    const mark = data.value || 'mf';
                    ctx.font = 'italic bold 14px serif';
                    ctx.fillStyle = data.color || '#CC0000';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(mark, x, y);
                },
            },
            bowing: {
                render: (ctx, x, y, data) => {
                    const type = data.value || 'down';
                    ctx.strokeStyle = data.color || '#333333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    if (type === 'down') {
                        ctx.moveTo(x - 8, y - 10);
                        ctx.lineTo(x - 8, y + 2);
                        ctx.lineTo(x + 8, y + 2);
                        ctx.lineTo(x + 8, y - 10);
                    } else {
                        ctx.moveTo(x - 8, y + 6);
                        ctx.lineTo(x, y - 10);
                        ctx.lineTo(x + 8, y + 6);
                    }
                    ctx.stroke();
                },
            },
            articulation: {
                render: (ctx, x, y, data) => {
                    const type = data.value || 'staccato';
                    ctx.fillStyle = data.color || '#333333';
                    ctx.strokeStyle = data.color || '#333333';
                    ctx.lineWidth = 2;
                    switch (type) {
                        case 'staccato':
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        case 'accent':
                            ctx.beginPath();
                            ctx.moveTo(x - 8, y - 4);
                            ctx.lineTo(x + 8, y);
                            ctx.lineTo(x - 8, y + 4);
                            ctx.stroke();
                            break;
                        case 'tenuto':
                            ctx.beginPath();
                            ctx.moveTo(x - 8, y);
                            ctx.lineTo(x + 8, y);
                            ctx.stroke();
                            break;
                        case 'fermata':
                            ctx.beginPath();
                            ctx.arc(x, y - 2, 8, Math.PI, 0);
                            ctx.stroke();
                            ctx.beginPath();
                            ctx.arc(x, y - 2, 2, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        default:
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fill();
                    }
                },
            },
        };

        function addStructuredAnnotationInternal(pageIndex, kind, measureNumber, normX, normY, data) {
            const canvas = annotationCanvases.get(pageIndex);
            if (!canvas) return;

            const annotation = {
                type: 'structured',
                kind,
                measureNumber,
                x: normX,
                y: normY,
                data: data || {},
                color: data?.color || strokeColor,
            };

            if (!storedAnnotations.has(pageIndex)) {
                storedAnnotations.set(pageIndex, []);
            }
            storedAnnotations.get(pageIndex).push(annotation);

            pushToUndoStack(pageIndex, annotation);
            redrawAnnotations(pageIndex);

            sendToFlutter('annotationAdded', {
                pageIndex,
                measureNumber,
                svgPath: '',
                x: normX,
                y: normY,
                color: annotation.color,
                width: 0,
                structured: true,
                kind,
                data,
            });
        }

        // ── Undo/Redo Functions ───────────────────────────────────────

        function pushToUndoStack(pageIndex, annotation) {
            undoStack.push({ pageIndex, annotation });
            if (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }
            redoStack = [];
            notifyHistoryState();
        }

        function undoAnnotation() {
            if (undoStack.length === 0) return;

            const entry = undoStack.pop();
            const { pageIndex, annotation } = entry;

            const annotations = storedAnnotations.get(pageIndex);
            if (annotations) {
                const idx = annotations.indexOf(annotation);
                if (idx !== -1) {
                    annotations.splice(idx, 1);
                } else if (annotations.length > 0) {
                    annotations.pop();
                }
                redrawAnnotations(pageIndex);
            }

            redoStack.push(entry);
            notifyHistoryState();
        }

        function redoAnnotation() {
            if (redoStack.length === 0) return;

            const entry = redoStack.pop();
            const { pageIndex, annotation } = entry;

            if (!storedAnnotations.has(pageIndex)) {
                storedAnnotations.set(pageIndex, []);
            }
            storedAnnotations.get(pageIndex).push(annotation);
            redrawAnnotations(pageIndex);

            undoStack.push(entry);
            notifyHistoryState();
        }

        function notifyHistoryState() {
            sendToFlutter('historyChanged', {
                canUndo: undoStack.length > 0,
                canRedo: redoStack.length > 0,
                undoCount: undoStack.length,
                redoCount: redoStack.length,
            });
        }

        // Configuration options
        const defaultOptions = {
            autoResize: true,
            drawTitle: true,
            drawSubtitle: true,
            drawComposer: true,
            drawLyricist: true,
            drawPartNames: true,
            drawPartAbbreviations: false,
            drawMeasureNumbers: true,
            drawMeasureNumbersOnlyAtSystemStart: true,
            drawTimeSignatures: true,
            drawMetronomeMarks: true,
            drawCredits: true,
            drawSlurs: true,
            drawFingerings: true,
            fingeringPosition: 'auto',
            followCursor: false,
            setWantedStemDirectionByXml: true,
            backend: 'svg',
            renderSingleHorizontalStaffline: false,
            stretchLastSystemLine: false,
        };

        // Parse URL parameters for initial config
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                frameId: params.get('frameId'),
                bgColor: params.get('bgColor'),
            };
        }

        // Initialize on load
        function init() {
            const params = getUrlParams();
            frameId = params.frameId;

            if (params.bgColor) {
                document.documentElement.style.setProperty('--bg-color', params.bgColor);
                document.body.style.backgroundColor = params.bgColor;
            }

            // Listen for messages from parent window (Flutter)
            window.addEventListener('message', handleMessage);

            // Initialize OSMD
            initOSMD();
        }

        // Initialize OSMD
        function initOSMD(options = {}) {
            const mergedOptions = { ...defaultOptions, ...options };

            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(
                    'osmd-container',
                    mergedOptions
                );

                isReady = true;
                hideLoading();

                // Process any pending MusicXML
                if (pendingMusicXml) {
                    loadMusicXml(pendingMusicXml);
                    pendingMusicXml = null;
                }

                // Notify Flutter that OSMD is ready
                sendToFlutter('ready', { success: true });

            } catch (error) {
                showError('Failed to initialize OSMD: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        // Load MusicXML content
        async function loadMusicXml(xmlContent) {
            console.log("OSMD: loadMusicXml called with type: " + typeof xmlContent);

            // Handle cases where we might get the payload object instead of the string
            if (xmlContent && typeof xmlContent === 'object' && xmlContent.xml) {
                console.log("OSMD: Detected object payload, extracting xml string");
                xmlContent = xmlContent.xml;
            } else if (xmlContent && typeof xmlContent === 'object') {
                console.log("OSMD: Detected object payload without xml key, stringifying:", JSON.stringify(xmlContent).substring(0, 50));
                // If it's the whole payload, we might need to drill down
                if (xmlContent.payload && xmlContent.payload.xml) {
                    xmlContent = xmlContent.payload.xml;
                }
            }

            if (!isReady) {
                console.log("OSMD: Not ready, storing pending XML");
                pendingMusicXml = xmlContent;
                return;
            }

            if (typeof xmlContent !== 'string') {
                console.error("OSMD: xmlContent is still not a string! Type: " + typeof xmlContent);
                console.log("Value:", xmlContent);
                hideLoading();
                return;
            }

            console.log("OSMD: xmlContent summary:", xmlContent.substring(0, 100));

            // Store original MusicXML for pagination
            originalMusicXml = xmlContent;

            try {
                await osmd.load(xmlContent);

                // Re-apply options after loading to ensure pagination
                setOptions({});

                hideLoading();

                // Send success and score info to Flutter
                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

                // Note: setupAnnotationCanvases() is called later by
                // reportScoreInfoSafe() after pagination detection completes,
                // or directly below if pagination is not needed.
                // Only setup canvases here if setOptions won't trigger pagination.
                // (reportScoreInfoSafe handles the paginated case)

            } catch (error) {
                hideLoading();
                showError('Failed to render MusicXML: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        // Load MusicXML from URL
        async function loadFromUrl(url) {
            if (!isReady) {
                return;
            }

            showLoading();
            hideError();

            try {
                await osmd.load(url);
                osmd.render();
                hideLoading();

                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to load from URL: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'url' });
            }
        }

        // Get information about the loaded score
        function getScoreInfo() {
            if (!osmd || !osmd.Sheet) {
                return {};
            }

            const sheet = osmd.Sheet;
            let pageCount = 0;

            console.log("OSMD: getScoreInfo checking pages...");
            // Try different ways to get page count depending on OSMD version/state
            if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages) {
                pageCount = osmd.GraphicSheet.MusicPages.length;
                console.log("OSMD: Found " + pageCount + " MusicPages in GraphicSheet");
            }

            if (pageCount === 0 && osmd.Drawer && osmd.Drawer.Pages) {
                pageCount = osmd.Drawer.Pages.length;
                console.log("OSMD: Found " + pageCount + " Pages in Drawer");
            }

            console.log("OSMD Final Page Count: " + pageCount);

            return {
                title: sheet.TitleString || '',
                composer: sheet.ComposerString || '',
                subtitle: sheet.SubtitleString || '',
                partCount: sheet.Parts ? sheet.Parts.length : 0,
                measureCount: sheet.SourceMeasures ? sheet.SourceMeasures.length : 0,
                pageCount: pageCount || 1,
            };
        }

        // Update rendering options
        async function setOptions(options, skipDetection = false) {
            if (!osmd) return;

            const container = document.getElementById('osmd-container');

            // Width-retry logic
            let width = container.clientWidth;
            let retries = 5;
            while (width === 0 && retries > 0) {
                console.log("OSMD: Container width is 0, retrying... (" + retries + " left)");
                await new Promise(resolve => setTimeout(resolve, 100));
                width = container.clientWidth;
                retries--;
            }

            console.log("OSMD: setOptions with width: " + width);

            // Force discrete A5 format
            osmd.setOptions({
                autoLayout: true,
                drawHiddenViews: false,
                ...options,
                pageFormat: "A4", // Back to A4 for a baseline
                verticalScrolling: false,
            });

            // Enforce discrete pages in EngravingRules
            if (osmd.rules) {
                osmd.rules.VerticalScrolling = false;

                // CRITICAL: Try to force a split by making the page height TINY 
                // and ensuring the rules don't allow stretching/overflow
                osmd.rules.PageHeight = 300; // 30mm
                osmd.rules.PageWidth = 1480;
                osmd.rules.LimitSystemWidth = true; // Ensure systems don't exceed page width

                // Allow line breaks more aggressively
                osmd.rules.CompactMode = true;

                console.log("OSMD: Rules forced PageHeight=" + osmd.rules.PageHeight);
            }

            // Re-render if already loaded
            if (osmd.Sheet) {
                console.log("OSMD: Rendering score...");
                osmd.render();

                // Reset scroll to ensure we start from the top
                if (container) {
                    container.scrollTop = 0;
                    console.log("OSMD: Reset scroll to top");
                }

                // Some versions of OSMD need a forced layout update for pagination
                if (osmd.GraphicSheet && osmd.GraphicSheet.reLayout) {
                    console.log("OSMD: FORCING GraphicSheet.reLayout()");
                    osmd.GraphicSheet.reLayout();
                }

                // Only run detection/reporting if not skipped (to avoid recursion when rendering split pages)
                if (!skipDetection) {
                    // Allow time for DOM to populate, then retry if needed
                    let retryCount = 0;
                    const attemptReport = () => {
                        if (retryCount < 10) {
                            // Check if BoundingBox is ready
                            if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages.length > 0) {
                                const firstPage = osmd.GraphicSheet.MusicPages[0];
                                if (firstPage.BoundingBox) {
                                    console.log("OSMD: BoundingBox ready, reporting score info");
                                    reportScoreInfoSafe();
                                    return;
                                }
                            }
                            retryCount++;
                            console.log(`OSMD: BoundingBox not ready, retry ${retryCount}/10`);
                            setTimeout(attemptReport, 200);
                        } else {
                            console.log("OSMD: BoundingBox never populated, reporting anyway");
                            reportScoreInfoSafe();
                        }
                    };
                    setTimeout(attemptReport, 300);
                } else {
                    console.log("OSMD: Skipping pagination detection (rendering split page)");
                }
            }
        }

        function reportScoreInfoSafe() {
            try {
                const info = getScoreInfo();

                // Detect how many systems fit and report overflow info
                const detectionResult = detectFittingSystems();
                info.fittingSystems = detectionResult.fittingSystems;
                info.totalSystems = detectionResult.totalSystems;
                info.lastFittingMeasure = detectionResult.lastFittingMeasure;
                info.canvasOverflow = detectionResult.canvasHeight > detectionResult.maxHeight;

                // Calculate pagination if systems overflow
                if (detectionResult.fittingSystems > 0 && detectionResult.totalSystems > detectionResult.fittingSystems) {
                    const totalPages = Math.ceil(detectionResult.totalSystems / detectionResult.fittingSystems);
                    info.calculatedPageCount = totalPages;
                    info.systemsPerPage = detectionResult.fittingSystems;

                    // Store pagination info globally for page navigation
                    paginationInfo = {
                        fittingSystems: detectionResult.fittingSystems,
                        totalSystems: detectionResult.totalSystems,
                        systemsPerPage: detectionResult.fittingSystems,
                        totalPages: totalPages,
                        pageMeasureRanges: [] // Will be populated below
                    };

                    // Calculate measure ranges for all pages upfront
                    console.log(`OSMD: Calculating measure ranges for ${totalPages} pages...`);
                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        const range = calculateMeasureRangeForPage(pageNum, paginationInfo);
                        paginationInfo.pageMeasureRanges.push(range);
                        if (range) {
                            console.log(`OSMD:   Page ${pageNum}: measures ${range.startMeasure}-${range.endMeasure}`);
                        }
                    }

                    console.log(`OSMD: Pagination - ${totalPages} pages needed (${detectionResult.fittingSystems} systems per page)`);

                    // Auto-navigate to page 1 after pagination detection
                    setTimeout(() => {
                        setPage(1).catch(err => console.error("OSMD: Failed to auto-navigate to page 1:", err));
                    }, 100);

                } else {
                    info.calculatedPageCount = 1;
                    info.systemsPerPage = detectionResult.totalSystems;

                    // No pagination needed - set up annotation canvases now
                    teardownAnnotationCanvases();
                    setupAnnotationCanvases();
                }

                const canvases = document.querySelectorAll('div[id^="osmdCanvasPage"]');
                console.log("OSMD: Discrete pages in DOM: " + canvases.length);

                if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages) {
                    console.log("OSMD: GraphicSheet.MusicPages after render and reLayout:", osmd.GraphicSheet.MusicPages.length);
                }

                console.log("OSMD Info after render:", info);
                sendToFlutter('loaded', info);
            } catch (e) {
                console.error("OSMD: Error reporting info:", e);
                // Try to send minimal info
                try {
                    const minimalInfo = getScoreInfo();
                    sendToFlutter('loaded', minimalInfo);
                } catch (e2) {
                    console.error("OSMD: Fatal error reporting info", e2);
                }
            }
        }

        // Detect how many music systems (lines) fit within the viewport
        function detectFittingSystems() {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.MusicPages.length) {
                console.log("OSMD: detect - Early exit (no osmd/sheet/pages)");
                return { fittingSystems: 0, totalSystems: 0, lastFittingMeasure: -1 };
            }

            const page = osmd.GraphicSheet.MusicPages[0];
            const container = document.getElementById('container');
            const maxHeight = container.clientHeight - 100;

            // Count total systems
            const totalSystems = page.MusicSystems ? page.MusicSystems.length : 0;

            console.log(`OSMD: detect - Total systems on page: ${totalSystems}`);

            // Try canvas-based detection since BoundingBox is unreliable
            let canvasPage = document.querySelector('div[id^="osmdCanvasPage"]');
            if (!canvasPage) {
                console.log("OSMD: detect - No canvas element found");
                return { fittingSystems: 0, totalSystems, lastFittingMeasure: -1 };
            }

            const canvasHeight = canvasPage.clientHeight;
            console.log(`OSMD: detect - Canvas: height=${canvasHeight}px, maxHeight=${maxHeight}px`);

            if (canvasHeight <= maxHeight) {
                console.log("OSMD: detect - All content fits in viewport");
                return { fittingSystems: totalSystems, totalSystems, lastFittingMeasure: -1 };
            }

            // Content overflows - estimate how many systems fit
            // Use a system-based ratio approach
            if (totalSystems > 0) {
                // Assume systems are evenly distributed vertically
                const visibleRatio = maxHeight / canvasHeight;
                const estimatedFittingSystems = Math.floor(totalSystems * visibleRatio);

                console.log(`OSMD: detect - Estimated ${estimatedFittingSystems}/${totalSystems} systems fit (${(visibleRatio * 100).toFixed(1)}% visible)`);

                // Get the last measure from the last fitting system
                let lastFittingMeasure = -1;
                if (page.MusicSystems && estimatedFittingSystems > 0 && estimatedFittingSystems <= totalSystems) {
                    const lastSystem = page.MusicSystems[estimatedFittingSystems - 1];
                    if (lastSystem && lastSystem.Staves && lastSystem.Staves.length > 0) {
                        for (const staff of lastSystem.Staves) {
                            if (staff.Measures && staff.Measures.length > 0) {
                                for (const measure of staff.Measures) {
                                    let idx = -1;
                                    if (measure.parentSourceMeasure) {
                                        idx = measure.parentSourceMeasure.measureListIndex;
                                    } else if (measure.MeasureNumber) {
                                        idx = measure.MeasureNumber - 1;
                                    }
                                    lastFittingMeasure = Math.max(lastFittingMeasure, idx);
                                }
                            }
                        }
                    }
                }

                console.log(`OSMD: detect - Last fitting measure index: ${lastFittingMeasure}`);

                return {
                    fittingSystems: estimatedFittingSystems,
                    totalSystems,
                    lastFittingMeasure,
                    canvasHeight,
                    maxHeight,
                    visibleRatio
                };
            }

            return { fittingSystems: 0, totalSystems, lastFittingMeasure: -1 };
        }

        // Calculate the range of measures that should be displayed for a given page
        function calculateMeasureRangeForPage(pageNum, paginInfo) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.MusicPages || !paginInfo) {
                console.error("OSMD: Cannot calculate measure range - missing data");
                return null;
            }

            const page = osmd.GraphicSheet.MusicPages[0];
            if (!page || !page.MusicSystems) {
                console.error("OSMD: No music systems found");
                return null;
            }

            const allSystems = page.MusicSystems;
            const systemsPerPage = paginInfo.systemsPerPage;

            // Calculate which systems belong to this page (0-indexed)
            const startSystemIndex = (pageNum - 1) * systemsPerPage;
            const endSystemIndex = Math.min(startSystemIndex + systemsPerPage - 1, allSystems.length - 1);

            if (startSystemIndex >= allSystems.length) {
                console.error(`OSMD: Page ${pageNum} out of range`);
                return null;
            }

            console.log(`OSMD: calculateMeasureRange - Page ${pageNum} uses systems ${startSystemIndex}-${endSystemIndex}`);

            // Get measure numbers from systems
            let minMeasure = Infinity;
            let maxMeasure = -Infinity;

            for (let sysIdx = startSystemIndex; sysIdx <= endSystemIndex; sysIdx++) {
                const system = allSystems[sysIdx];
                if (!system || !system.staffLines || system.staffLines.length === 0) {
                    continue;
                }

                const firstStaff = system.staffLines[0];
                if (!firstStaff || !firstStaff.measures) {
                    continue;
                }

                for (const measure of firstStaff.measures) {
                    if (!measure) continue;

                    let measureNum;
                    if (measure.measureNumber !== undefined) {
                        measureNum = measure.measureNumber - 1;
                    } else if (measure.parentSourceMeasure && measure.parentSourceMeasure.MeasureNumber !== undefined) {
                        measureNum = measure.parentSourceMeasure.MeasureNumber - 1;
                    }

                    if (measureNum !== undefined) {
                        minMeasure = Math.min(minMeasure, measureNum);
                        maxMeasure = Math.max(maxMeasure, measureNum);
                    }
                }
            }

            // CRITICAL FIX: Force page 1 to always start at measure 0
            if (pageNum === 1) {
                console.log(`OSMD: Page 1 - forcing minMeasure to 0 (was ${minMeasure})`);
                minMeasure = 0;
            }

            if (minMeasure === Infinity || maxMeasure === -Infinity) {
                console.error("OSMD: Could not determine measure range");
                return null;
            }

            console.log(`OSMD: calculateMeasureRange - Measures ${minMeasure}-${maxMeasure} for page ${pageNum}`);
            return { startMeasure: minMeasure, endMeasure: maxMeasure };
        }


        // Set zoom level (1.0 = 100%)
        function setZoom(zoomLevel) {
            if (!osmd) return;

            console.log("OSMD: setZoom to " + zoomLevel);
            osmd.Zoom = zoomLevel;

            // Re-apply options which calls render and updates page info
            // Skip pagination detection to prevent view reset
            setOptions({}, true);

            // After zoom, rebuild annotation canvases with new sizes
            teardownAnnotationCanvases();
            setupAnnotationCanvases();
        }

        // Split MusicXML to extract only specific measures
        function splitMusicXmlByMeasures(xmlString, startMeasure, endMeasure) {
            try {
                console.log(`OSMD: Splitting MusicXML to extract measures ${startMeasure}-${endMeasure}`);

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, 'text/xml');

                // Check for parse errors
                const parserError = xmlDoc.querySelector('parsererror');
                if (parserError) {
                    console.error("OSMD: XML parse error:", parserError.textContent);
                    return null;
                }

                // Get all parts
                const parts = xmlDoc.querySelectorAll('part');
                console.log(`OSMD: Found ${parts.length} parts to process`);

                // Keep track of initial attributes for preservation
                let initialAttributes = null;

                // Process each part
                parts.forEach((part, partIndex) => {
                    const measures = part.querySelectorAll('measure');
                    console.log(`OSMD:   Part ${partIndex}: ${measures.length} total measures`);

                    // Extract initial attributes from measure 0 (for later injection)
                    if (startMeasure > 0 && measures.length > 0 && !initialAttributes) {
                        const firstMeasure = measures[0];
                        const attrs = firstMeasure.querySelector('attributes');
                        if (attrs) {
                            initialAttributes = attrs.cloneNode(true);
                            console.log("OSMD: Preserved initial attributes from measure 0");
                        }
                    }

                    let removedCount = 0;
                    // Iterate backwards to safely remove elements
                    for (let i = measures.length - 1; i >= 0; i--) {
                        const measure = measures[i];
                        const measureNumber = parseInt(measure.getAttribute('number')) - 1; // Convert to 0-indexed

                        // Keep measures in range, remove others
                        if (measureNumber < startMeasure || measureNumber > endMeasure) {
                            measure.remove();
                            removedCount++;
                        }
                    }

                    console.log(`OSMD:   Part ${partIndex}: Removed ${removedCount} measures, keeping ${measures.length - removedCount}`);
                });

                // If we didn't start from measure 0, inject initial attributes into the first remaining measure
                if (startMeasure > 0 && initialAttributes) {
                    const firstPart = xmlDoc.querySelector('part');
                    if (firstPart) {
                        const firstRemainingMeasure = firstPart.querySelector('measure');
                        if (firstRemainingMeasure) {
                            // Check if measure already has attributes
                            const existingAttrs = firstRemainingMeasure.querySelector('attributes');
                            if (!existingAttrs) {
                                // Insert attributes at the beginning of the measure
                                firstRemainingMeasure.insertBefore(initialAttributes, firstRemainingMeasure.firstChild);
                                console.log("OSMD: Injected initial attributes into first measure");
                            }
                        }
                    }
                }

                // Serialize back to string
                const serializer = new XMLSerializer();
                const result = serializer.serializeToString(xmlDoc);

                // Log a preview of the result
                console.log(`OSMD: Split XML length: ${result.length} characters`);

                return result;

            } catch (error) {
                console.error("OSMD: Error splitting MusicXML:", error);
                return null;
            }
        }

        // Set current page (renders only the measures for this page)
        async function setPage(pageNumber) {
            console.log(`OSMD: setPage called for page ${pageNumber}`);

            if (!originalMusicXml) {
                console.log("OSMD: No original MusicXML stored");
                return;
            }

            if (!paginationInfo || !paginationInfo.pageMeasureRanges) {
                console.log("OSMD: No pagination info or measure ranges available");
                return;
            }

            currentPageNumber = pageNumber;

            // Get the precomputed measure range for this page (0-indexed array)
            const measureRange = paginationInfo.pageMeasureRanges[pageNumber - 1];
            if (!measureRange) {
                console.error(`OSMD: No measure range found for page ${pageNumber}`);
                return;
            }

            console.log(`OSMD: Rendering page ${pageNumber} with measures ${measureRange.startMeasure}-${measureRange.endMeasure}`);

            try {
                // Split the MusicXML to include only measures for this page
                const splitXml = splitMusicXmlByMeasures(originalMusicXml, measureRange.startMeasure, measureRange.endMeasure);

                if (!splitXml) {
                    console.error("OSMD: Failed to split MusicXML");
                    return;
                }

                // Reload OSMD with the split document
                await osmd.load(splitXml);

                // Re-apply options (but skip re-detection to avoid infinite loop)
                setOptions({}, true); // Pass skipDetection flag

                // Re-setup annotation canvases after page re-render
                teardownAnnotationCanvases();
                setupAnnotationCanvases();

                console.log(`OSMD: Successfully rendered page ${pageNumber}`);

            } catch (error) {
                console.error(`OSMD: Error rendering page ${pageNumber}:`, error);
                showError(`Failed to render page ${pageNumber}: ` + error.message);
            }
        }

        // Navigate to a specific measure
        function goToMeasure(measureNumber) {
            if (!osmd || !osmd.Sheet) return;

            if (osmd.cursor) {
                osmd.cursor.show();
                osmd.cursor.reset();
                for (let i = 0; i < measureNumber - 1; i++) {
                    osmd.cursor.next();
                }
            }
        }

        // Clear the current score
        function clear() {
            if (osmd) {
                osmd.clear();
            }
            hideError();
        }

        // UI helpers
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }

        // Communication with Flutter (via postMessage to parent)
        function sendToFlutter(eventType, data) {
            const message = {
                type: eventType,
                data: data,
                frameId: frameId,
            };

            // Post message to parent window (Flutter web app)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(message, '*');
            }

            // Also log for debugging
            console.log('OSMD -> Flutter:', message);
        }

        // Handle messages from Flutter
        function handleMessage(event) {
            // Validate origin in production
            // if (event.origin !== expectedOrigin) return;

            try {
                const data = event.data;
                if (!data || !data.action) return;

                // Check if message is for this frame
                if (data.targetFrameId && data.targetFrameId !== frameId) return;

                const { action, payload } = data;

                switch (action) {
                    case 'init':
                        if (!isReady) {
                            initOSMD(payload || {});
                        }
                        break;
                    case 'load':
                        loadMusicXml(payload.xml);
                        break;
                    case 'loadUrl':
                        loadFromUrl(payload.url);
                        break;
                    case 'setOptions':
                        setOptions(payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'goToMeasure':
                        goToMeasure(payload.measure);
                        break;
                    case 'clear':
                        clear();
                        break;
                    // ── Annotation Actions ──
                    case 'setAnnotationMode':
                        setAnnotationModeInternal(payload.enabled);
                        break;
                    case 'setAnnotationStyle':
                        setAnnotationStyleInternal(payload.color, payload.width);
                        break;
                    case 'loadAnnotations':
                        loadAnnotationsInternal(payload.annotations || []);
                        break;
                    case 'clearAnnotations':
                        clearAnnotationsInternal(payload.pageIndex);
                        break;
                    case 'removeLastAnnotation':
                        removeLastAnnotationInternal(payload.pageIndex);
                        break;
                    case 'addStructuredAnnotation':
                        addStructuredAnnotationInternal(
                            payload.pageIndex,
                            payload.kind,
                            payload.measureNumber,
                            payload.x,
                            payload.y,
                            payload.data
                        );
                        break;
                    case 'undo':
                        undoAnnotation();
                        break;
                    case 'redo':
                        redoAnnotation();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (osmd && osmd.Sheet) {
                    osmd.render();
                    // Re-setup annotation canvases after re-render
                    teardownAnnotationCanvases();
                    setupAnnotationCanvases();
                }
            }, 250);
        });

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
