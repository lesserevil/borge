<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicXML Renderer - Native Pagination</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 40px;
            scroll-behavior: smooth;
            display: flex;
            align-items: center;
            background-color: #f8f9fa;
        }

        #osmd-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            min-height: 100%;
        }

        /* Style the pages for a premium look */
        div[id^="osmdCanvasPage"] {
            background-color: white !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            border: 1px solid #e0e0e0 !important;
            margin: 0 40px !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0 !important;
        }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            padding: 20px;
            color: #c0392b;
            text-align: center;
        }

        #error.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <span>Loading sheet music...</span>
        </div>
        <div id="error"></div>
        <div id="osmd-container"></div>
    </div>

    <script>
        // Global state
        let osmd = null;
        let isReady = false;
        let pendingMusicXml = null;
        let currentPageNumber = 1;
        let totalPages = 0;

        // Configuration options
        const defaultOptions = {
            autoResize: true,
            drawTitle: true,
            drawSubtitle: true,
            drawComposer: true,
            drawLyricist: true,
            drawPartNames: true,
            drawPartAbbreviations: false,
            drawMeasureNumbers: true,
            drawMeasureNumbersOnlyAtSystemStart: true,
            drawTimeSignatures: true,
            drawMetronomeMarks: true,
            drawCredits: true,
            drawSlurs: true,
            drawFingerings: true,
            fingeringPosition: 'auto',
            followCursor: false,
            setWantedStemDirectionByXml: true,
            backend: 'svg',
            renderSingleHorizontalStaffline: false,
            stretchLastSystemLine: false,

            // NATIVE PAGINATION SETTINGS
            pageFormat: 'A4',  // Standard page format
            pageBackgroundColor: '#FFFFFF',
            renderSingleHorizontalStaffline: false,
        };

        // Initialize OSMD with native pagination
        async function initOSMD(options = {}) {
            const mergedOptions = { ...defaultOptions, ...options };

            try {
                // Create OSMD with page format
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(
                    'osmd-container',
                    mergedOptions
                );

                // Don't override EngravingRules dimensions - let OSMD use its defaults
                // This avoids the 0-width rendering bug

                isReady = true;
                hideLoading();

                // Process any pending MusicXML
                if (pendingMusicXml) {
                    await loadMusicXml(pendingMusicXml);
                    pendingMusicXml = null;
                }

                // Notify Flutter that OSMD is ready
                sendToFlutter('ready', { success: true });

            } catch (error) {
                showError('Failed to initialize OSMD: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        // Load MusicXML content and let OSMD handle pagination
        async function loadMusicXml(xmlContent) {
            if (!isReady) {
                pendingMusicXml = xmlContent;
                return;
            }

            showLoading();
            hideError();

            console.log("OSMD: loadMusicXml called");

            // Handle cases where we might get the payload object instead of the string
            if (xmlContent && typeof xmlContent === 'object' && xmlContent.xml) {
                xmlContent = xmlContent.xml;
            } else if (xmlContent && typeof xmlContent === 'object') {
                if (xmlContent.payload && xmlContent.payload.xml) {
                    xmlContent = xmlContent.payload.xml;
                }
            }

            try {
                await osmd.load(xmlContent);
                await osmd.render();

                hideLoading();

                // Get page count from OSMD
                const scoreInfo = getScoreInfo();
                totalPages = scoreInfo.pageCount;
                currentPageNumber = 1;

                console.log(`OSMD: Loaded with ${totalPages} pages`);

                // Scroll to first page
                scrollToPage(1);

                // Send success and score info to Flutter
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to render MusicXML: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        // Get information about the loaded score
        function getScoreInfo() {
            if (!osmd || !osmd.Sheet) {
                return {};
            }

            const sheet = osmd.Sheet;
            let pageCount = 0;

            // Try to get page count from GraphicSheet
            if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages) {
                pageCount = osmd.GraphicSheet.MusicPages.length;
                console.log(`OSMD: GraphicSheet has ${pageCount} pages`);
            }

            // Fallback to Drawer
            if (pageCount === 0 && osmd.Drawer && osmd.Drawer.Pages) {
                pageCount = osmd.Drawer.Pages.length;
                console.log(`OSMD: Drawer has ${pageCount} pages`);
            }

            // Count actual canvas pages in DOM
            const canvasPages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            if (canvasPages.length > 0) {
                pageCount = canvasPages.length;
                console.log(`OSMD: Found ${pageCount} canvas pages in DOM`);
            }

            return {
                title: sheet.TitleString || '',
                composer: sheet.ComposerString || '',
                subtitle: sheet.SubtitleString || '',
                partCount: sheet.Parts ? sheet.Parts.length : 0,
                measureCount: sheet.SourceMeasures ? sheet.SourceMeasures.length : 0,
                pageCount: pageCount || 1,
                calculatedPageCount: pageCount || 1,
            };
        }

        // Scroll to a specific page (native approach - just scroll horizontally)
        function scrollToPage(pageNumber) {
            console.log(`OSMD: scrollToPage(${pageNumber})`);

            if (pageNumber < 1 || pageNumber > totalPages) {
                console.warn(`OSMD: Page ${pageNumber} out of range (1-${totalPages})`);
                return;
            }

            currentPageNumber = pageNumber;

            // Find all canvas pages
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            if (pages.length === 0) {
                console.warn('OSMD: No canvas pages found');
                return;
            }

            // Get the target page (0-indexed)
            const targetPage = pages[pageNumber - 1];
            if (!targetPage) {
                console.warn(`OSMD: Page element ${pageNumber} not found`);
                return;
            }

            // Scroll the container to show this page
            const container = document.getElementById('container');
            const containerRect = container.getBoundingClientRect();
            const pageRect = targetPage.getBoundingClientRect();

            // Calculate scroll position to center the page
            const scrollLeft = targetPage.offsetLeft - container.offsetLeft - 40;

            console.log(`OSMD: Scrolling to page ${pageNumber} at position ${scrollLeft}px`);

            container.scrollTo({
                left: scrollLeft,
                behavior: 'smooth'
            });

            // Notify Flutter of successful navigation
            sendToFlutter('pageChanged', {
                page: pageNumber,
                totalPages: totalPages
            });
        }

        // Set current page (native pagination version)
        async function setPage(pageNumber) {
            scrollToPage(pageNumber);
        }

        // Update rendering options
        async function setOptions(options) {
            if (!osmd) return;

            const container = document.getElementById('osmd-container');

            // Width-retry logic
            let width = container.clientWidth;
            let retries = 5;
            while (width === 0 && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, 100));
                width = container.clientWidth;
                retries--;
            }

            // Update options
            osmd.setOptions({
                ...options,
            });

            // Update page dimensions if EngravingRules exist
            if (osmd.EngravingRules) {
                const mainContainer = document.getElementById('container');
                const maxHeight = mainContainer.clientHeight - 80;
                const maxWidth = mainContainer.clientWidth - 120;

                osmd.EngravingRules.PageHeight = maxHeight;
                osmd.EngravingRules.PageWidth = maxWidth;
            }

            if (osmd.Sheet) {
                await osmd.render();

                // Get updated page count
                const scoreInfo = getScoreInfo();
                totalPages = scoreInfo.pageCount;

                // Stay on current page if possible
                if (currentPageNumber > totalPages) {
                    currentPageNumber = totalPages;
                }

                scrollToPage(currentPageNumber);

                // Notify Flutter
                sendToFlutter('loaded', scoreInfo);
            }
        }

        // Set zoom level (1.0 = 100%)
        function setZoom(zoomLevel) {
            if (!osmd) return;
            console.log(`OSMD: Setting zoom to ${zoomLevel}`);
            osmd.Zoom = zoomLevel;
            setOptions({});
        }

        // Navigate to a specific measure
        function goToMeasure(measureNumber) {
            if (!osmd || !osmd.Sheet) return;
            if (osmd.cursor) {
                osmd.cursor.show();
                for (let i = 0; i < measureNumber - 1; i++) {
                    osmd.cursor.next();
                }
            }
        }

        // Clear the current score
        function clear() {
            if (osmd) {
                osmd.clear();
            }
            hideError();
        }

        // UI helpers
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }

        // Communication with parent page or Flutter
        function sendToFlutter(eventType, data) {
            const message = JSON.stringify({ type: eventType, data: data });

            // For iframe: send to parent window
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(message, '*');
                console.log('Sent to parent:', message);
            }
            // For Flutter webview
            else if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(message);
                console.log('Sent to Flutter:', message);
            }
            else {
                console.log('Message (no receiver):', message);
            }
        }

        // Handle messages from Flutter or parent window
        function handleFlutterMessage(message) {
            try {
                const parsed = typeof message === 'string' ? JSON.parse(message) : message;
                const { action, payload } = parsed;

                console.log('Received action:', action, payload);

                switch (action) {
                    case 'init':
                        initOSMD(payload || {});
                        break;
                    case 'load':
                        loadMusicXml(payload.xml);
                        break;
                    case 'setOptions':
                        setOptions(payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'goToMeasure':
                        goToMeasure(payload.measure);
                        break;
                    case 'clear':
                        clear();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        // Expose function globally
        window.handleFlutterMessage = handleFlutterMessage;

        // Listen for postMessage from parent window
        window.addEventListener('message', (event) => {
            handleFlutterMessage(event.data);
        });

        // Auto-initialize OSMD on page load
        window.addEventListener('load', () => {
            initOSMD();
        });

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (osmd && osmd.Sheet) {
                    setOptions({});
                }
            }, 250);
        });
    </script>
</body>

</html>
