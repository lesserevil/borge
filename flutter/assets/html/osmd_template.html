<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicXML Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 40px;
            scroll-behavior: smooth;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #f8f9fa;
        }

        #osmd-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
        }

        /* Style the pages for a premium look */
        div[id^="osmdCanvasPage"] {
            background-color: white !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            border: 1px solid #e0e0e0 !important;
            margin: 0 40px !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0 !important;
        }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            padding: 20px;
            color: #c0392b;
            text-align: center;
        }

        #error.visible {
            display: block;
        }

        /* OSMD styling overrides */
        .osmd-container svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <span>Loading sheet music...</span>
        </div>
        <div id="error"></div>
        <div id="osmd-container"></div>
    </div>

    <script>
        // Global state
        let osmd = null;
        let isReady = false;
        let pendingMusicXml = null;

        // Pagination state
        let originalMusicXml = null;
        let paginationInfo = null; // Stores {fittingSystems, totalSystems, systemsPerPage, totalPages, pageMeasureRanges}
        let currentPageNumber = 1;

        // Configuration options
        const defaultOptions = {
            autoResize: true,
            drawTitle: true,
            drawSubtitle: true,
            drawComposer: true,
            drawLyricist: true,
            drawPartNames: true,
            drawPartAbbreviations: false,
            drawMeasureNumbers: true,
            drawMeasureNumbersOnlyAtSystemStart: true,
            drawTimeSignatures: true,
            drawMetronomeMarks: true,
            drawCredits: true,
            drawSlurs: true,
            drawFingerings: true,
            fingeringPosition: 'auto',
            followCursor: false,
            setWantedStemDirectionByXml: true,
            backend: 'svg',
            // Rendering quality
            renderSingleHorizontalStaffline: false,
            // Layout
            stretchLastSystemLine: false,
        };

        // Initialize OSMD
        async function initOSMD(options = {}) {
            const mergedOptions = { ...defaultOptions, ...options };

            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(
                    'osmd-container',
                    mergedOptions
                );

                isReady = true;
                hideLoading();

                // Process any pending MusicXML
                if (pendingMusicXml) {
                    await loadMusicXml(pendingMusicXml);
                    pendingMusicXml = null;
                }

                // If initial page is provided in options, go there
                if (mergedOptions.initialPage) {
                    setPage(mergedOptions.initialPage);
                }

                // Notify Flutter that OSMD is ready
                sendToFlutter('ready', { success: true });

            } catch (error) {
                showError('Failed to initialize OSMD: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        // Load MusicXML content (string or base64 mxl)
        async function loadMusicXml(xmlContent) {
            if (!isReady) {
                pendingMusicXml = xmlContent;
                return;
            }

            showLoading();
            hideError();

            console.log("OSMD: loadMusicXml called");

            // Handle cases where we might get the payload object instead of the string
            if (xmlContent && typeof xmlContent === 'object' && xmlContent.xml) {
                xmlContent = xmlContent.xml;
            } else if (xmlContent && typeof xmlContent === 'object') {
                if (xmlContent.payload && xmlContent.payload.xml) {
                    xmlContent = xmlContent.payload.xml;
                }
            }

            if (!isReady) {
                pendingMusicXml = xmlContent;
                return;
            }

            // Store original MusicXML for pagination
            originalMusicXml = xmlContent;

            try {
                await osmd.load(xmlContent);

                // Re-apply options after loading to ensure pagination
                setOptions({});

                hideLoading();

                // Send success and score info to Flutter
                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to render MusicXML: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        // Load MusicXML from URL
        async function loadFromUrl(url) {
            if (!isReady) {
                return;
            }

            showLoading();
            hideError();

            try {
                await osmd.load(url);
                osmd.render();
                hideLoading();

                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to load from URL: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'url' });
            }
        }

        // Get information about the loaded score
        function getScoreInfo() {
            if (!osmd || !osmd.Sheet) {
                return {};
            }

            const sheet = osmd.Sheet;
            let pageCount = 0;

            if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages) {
                pageCount = osmd.GraphicSheet.MusicPages.length;
            }

            if (pageCount === 0 && osmd.Drawer && osmd.Drawer.Pages) {
                pageCount = osmd.Drawer.Pages.length;
            }

            return {
                title: sheet.TitleString || '',
                composer: sheet.ComposerString || '',
                subtitle: sheet.SubtitleString || '',
                partCount: sheet.Parts ? sheet.Parts.length : 0,
                measureCount: sheet.SourceMeasures ? sheet.SourceMeasures.length : 0,
                pageCount: pageCount || 1,
            };
        }

        // Update rendering options
        async function setOptions(options, skipDetection = false) {
            if (!osmd) return;

            const container = document.getElementById('osmd-container');

            // Width-retry logic
            let width = container.clientWidth;
            let retries = 5;
            while (width === 0 && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, 100));
                width = container.clientWidth;
                retries--;
            }

            // Force format and pagination
            osmd.setOptions({
                autoLayout: true,
                drawHiddenViews: false,
                ...options,
                pageFormat: "A5",
                verticalScrolling: false,
            });

            if (osmd.rules) {
                osmd.rules.VerticalScrolling = false;
                // Force discrete page breaks
                osmd.rules.PageHeight = 300;
                osmd.rules.PageWidth = 1480;
                osmd.rules.CompactMode = true;
            }

            if (osmd.Sheet) {
                osmd.render();

                // Reset scroll to ensure we start from the top
                const mainContainer = document.getElementById('container');
                if (mainContainer) {
                    mainContainer.scrollTop = 0;
                }

                // Some versions of OSMD need a forced layout update
                if (osmd.GraphicSheet && osmd.GraphicSheet.reLayout) {
                    osmd.GraphicSheet.reLayout();
                }

                // Only run detection/reporting if not skipped
                if (!skipDetection) {
                    setTimeout(() => {
                        reportScoreInfoSafe();
                    }, 500);
                } else {
                    console.log("OSMD: Skipping pagination detection (rendering split page)");
                }
            }
        }

        // Safe score info reporting with pagination detection
        function reportScoreInfoSafe() {
            try {
                const info = getScoreInfo();

                // Detect how many systems fit
                const detectionResult = detectFittingSystems();
                info.fittingSystems = detectionResult.fittingSystems;
                info.totalSystems = detectionResult.totalSystems;
                info.lastFittingMeasure = detectionResult.lastFittingMeasure;
                info.canvasOverflow = detectionResult.canvasHeight > detectionResult.maxHeight;

                // Calculate pagination if systems overflow
                if (detectionResult.fittingSystems > 0 && detectionResult.totalSystems > detectionResult.fittingSystems) {
                    const totalPages = Math.ceil(detectionResult.totalSystems / detectionResult.fittingSystems);
                    info.calculatedPageCount = totalPages;
                    info.systemsPerPage = detectionResult.fittingSystems;

                    // Store pagination info globally
                    paginationInfo = {
                        fittingSystems: detectionResult.fittingSystems,
                        totalSystems: detectionResult.totalSystems,
                        systemsPerPage: detectionResult.fittingSystems,
                        totalPages: totalPages,
                        pageMeasureRanges: []
                    };

                    // Calculate measure ranges for all pages
                    console.log(`OSMD: Calculating measure ranges for ${totalPages} pages...`);
                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        const range = calculateMeasureRangeForPage(pageNum, paginationInfo);
                        paginationInfo.pageMeasureRanges.push(range);
                        if (range) {
                            console.log(`OSMD:   Page ${pageNum}: measures ${range.startMeasure}-${range.endMeasure}`);
                        }
                    }

                    console.log(`OSMD: Pagination - ${totalPages} pages needed`);

                    // Auto-navigate to page 1
                    setTimeout(() => {
                        setPage(1).catch(err => console.error("OSMD: Failed to navigate to page 1:", err));
                    }, 100);

                } else {
                    info.calculatedPageCount = 1;
                    info.systemsPerPage = detectionResult.totalSystems;
                }

                console.log("OSMD Info:", info);
                sendToFlutter('loaded', info);
            } catch (e) {
                console.error("OSMD: Error reporting info:", e);
                try {
                    sendToFlutter('loaded', getScoreInfo());
                } catch (e2) {
                    console.error("OSMD: Fatal error", e2);
                }
            }
        }

        // Detect how many music systems (lines) fit within the viewport
        function detectFittingSystems() {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.MusicPages || !osmd.GraphicSheet.MusicPages.length) {
                console.log("OSMD: detect - No music pages available");
                return { fittingSystems: 0, totalSystems: 0, lastFittingMeasure: -1 };
            }

            const page = osmd.GraphicSheet.MusicPages[0];
            if (!page || !page.MusicSystems) {
                console.log("OSMD: detect - No music systems found");
                return { fittingSystems: 0, totalSystems: 0, lastFittingMeasure: -1 };
            }

            const totalSystems = page.MusicSystems.length;
            const container = document.getElementById('container');
            const maxHeight = container.clientHeight - 80; // Account for padding

            console.log(`OSMD: detect - Total systems: ${totalSystems}, max viewport height: ${maxHeight}px`);

            // Get canvas to calculate pixel conversion
            const canvasPage = document.querySelector('div[id^="osmdCanvasPage"]');
            if (!canvasPage) {
                console.log("OSMD: detect - No canvas page found");
                return { fittingSystems: totalSystems, totalSystems, lastFittingMeasure: -1 };
            }

            const canvasHeight = canvasPage.clientHeight;
            console.log(`OSMD: detect - Canvas: height=${canvasHeight}px, maxHeight=${maxHeight}px`);

            if (canvasHeight <= maxHeight) {
                console.log("OSMD: detect - All content fits in viewport");
                return { fittingSystems: totalSystems, totalSystems, lastFittingMeasure: -1, canvasHeight, maxHeight };
            }

            // Content overflows - estimate how many systems fit
            if (totalSystems > 0) {
                const visibleRatio = maxHeight / canvasHeight;
                const estimatedFittingSystems = Math.floor(totalSystems * visibleRatio);

                console.log(`OSMD: detect - Estimated ${estimatedFittingSystems}/${totalSystems} systems fit`);

                // Get last measure from last fitting system
                let lastFittingMeasure = -1;
                if (page.MusicSystems && estimatedFittingSystems > 0 && estimatedFittingSystems <= totalSystems) {
                    const lastSystem = page.MusicSystems[estimatedFittingSystems - 1];
                    if (lastSystem && lastSystem.staffLines && lastSystem.staffLines.length > 0) {
                        const firstStaff = lastSystem.staffLines[0];
                        if (firstStaff && firstStaff.measures && firstStaff.measures.length > 0) {
                            const lastMeasureInSystem = firstStaff.measures[firstStaff.measures.length - 1];
                            if (lastMeasureInSystem) {
                                lastFittingMeasure = lastMeasureInSystem.measureNumber - 1;
                            }
                        }
                    }
                }

                console.log(`OSMD: detect - Last fitting measure: ${lastFittingMeasure}`);

                return {
                    fittingSystems: estimatedFittingSystems,
                    totalSystems,
                    lastFittingMeasure,
                    canvasHeight,
                    maxHeight,
                    visibleRatio
                };
            }

            return { fittingSystems: 0, totalSystems, lastFittingMeasure: -1, canvasHeight, maxHeight };
        }


        // Calculate the range of measures for a given page (with Page 1 fix)
        function calculateMeasureRangeForPage(pageNum, paginInfo) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.MusicPages || !paginInfo) {
                console.error("OSMD: Cannot calculate measure range - missing data");
                return null;
            }

            const page = osmd.GraphicSheet.MusicPages[0];
            if (!page || !page.MusicSystems) {
                console.error("OSMD: No music systems found");
                return null;
            }

            const allSystems = page.MusicSystems;
            const systemsPerPage = paginInfo.systemsPerPage;

            const startSystemIndex = (pageNum - 1) * systemsPerPage;
            const endSystemIndex = Math.min(startSystemIndex + systemsPerPage - 1, allSystems.length - 1);

            if (startSystemIndex >= allSystems.length) {
                console.error(`OSMD: Page ${pageNum} out of range`);
                return null;
            }

            console.log(`OSMD: calculateMeasureRange - Page ${pageNum} uses systems ${startSystemIndex}-${endSystemIndex}`);

            let minMeasure = Infinity;
            let maxMeasure = -Infinity;

            for (let sysIdx = startSystemIndex; sysIdx <= endSystemIndex; sysIdx++) {
                const system = allSystems[sysIdx];
                if (!system || !system.staffLines || system.staffLines.length === 0) {
                    continue;
                }

                const firstStaff = system.staffLines[0];
                if (!firstStaff || !firstStaff.measures) {
                    continue;
                }

                for (const measure of firstStaff.measures) {
                    if (!measure) continue;

                    let measureNum;
                    if (measure.measureNumber !== undefined) {
                        measureNum = measure.measureNumber - 1;
                    } else if (measure.parentSourceMeasure && measure.parentSourceMeasure.MeasureNumber !== undefined) {
                        measureNum = measure.parentSourceMeasure.MeasureNumber - 1;
                    }

                    if (measureNum !== undefined) {
                        minMeasure = Math.min(minMeasure, measureNum);
                        maxMeasure = Math.max(maxMeasure, measureNum);
                    }
                }
            }

            // CRITICAL FIX: Force page 1 to always start at measure 0
            if (pageNum === 1) {
                console.log(`OSMD: Page 1 - forcing minMeasure to 0 (was ${minMeasure})`);
                minMeasure = 0;
            }

            if (minMeasure === Infinity || maxMeasure === -Infinity) {
                console.error("OSMD: Could not determine measure range");
                return null;
            }

            console.log(`OSMD: calculateMeasureRange - Measures ${minMeasure}-${maxMeasure} for page ${pageNum}`);
            return { startMeasure: minMeasure, endMeasure: maxMeasure };
        }

        // Split MusicXML to extract only specific measures
        function splitMusicXmlByMeasures(xmlString, startMeasure, endMeasure) {
            try {
                console.log(`OSMD: Splitting MusicXML to extract measures ${startMeasure}-${endMeasure}`);

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, 'text/xml');

                const parserError = xmlDoc.querySelector('parsererror');
                if (parserError) {
                    console.error("OSMD: XML parse error:", parserError.textContent);
                    return null;
                }

                const parts = xmlDoc.querySelectorAll('part');
                let initialAttributes = null;

                parts.forEach((part, partIndex) => {
                    const measures = part.querySelectorAll('measure');

                    // Preserve initial attributes from measure 0
                    if (startMeasure > 0 && measures.length > 0 && !initialAttributes) {
                        const firstMeasure = measures[0];
                        const attrs = firstMeasure.querySelector('attributes');
                        if (attrs) {
                            initialAttributes = attrs.cloneNode(true);
                        }
                    }

                    // Remove measures outside the range
                    for (let i = measures.length - 1; i >= 0; i--) {
                        const measure = measures[i];
                        const measureNumber = parseInt(measure.getAttribute('number')) - 1;

                        if (measureNumber < startMeasure || measureNumber > endMeasure) {
                            measure.remove();
                        }
                    }
                });

                // Inject initial attributes if  starting after measure 0
                if (startMeasure > 0 && initialAttributes) {
                    const firstPart = xmlDoc.querySelector('part');
                    if (firstPart) {
                        const firstRemainingMeasure = firstPart.querySelector('measure');
                        if (firstRemainingMeasure) {
                            const existingAttrs = firstRemainingMeasure.querySelector('attributes');
                            if (!existingAttrs) {
                                firstRemainingMeasure.insertBefore(initialAttributes, firstRemainingMeasure.firstChild);
                            }
                        }
                    }
                }

                const serializer = new XMLSerializer();
                return serializer.serializeToString(xmlDoc);

            } catch (error) {
                console.error("OSMD: Error splitting MusicXML:", error);
                return null;
            }
        }

        // Set zoom level (1.0 = 100%)
        function setZoom(zoomLevel) {
            if (!osmd) return;
            osmd.Zoom = zoomLevel;
            setOptions({});
        }

        // Set current page (renders only the measures for this page)
        async function setPage(pageNumber) {
            console.log(`OSMD: setPage called for page ${pageNumber}`);

            if (!originalMusicXml) {
                console.log("OSMD: No original MusicXML stored");
                return;
            }

            if (!paginationInfo || !paginationInfo.pageMeasureRanges) {
                console.log("OSMD: No pagination info or measure ranges available");
                return;
            }

            currentPageNumber = pageNumber;

            // Get the precomputed measure range for this page
            const measureRange = paginationInfo.pageMeasureRanges[pageNumber - 1];
            if (!measureRange) {
                console.error(`OSMD: No measure range found for page ${pageNumber}`);
                return;
            }

            console.log(`OSMD: Rendering page ${pageNumber} with measures ${measureRange.startMeasure}-${measureRange.endMeasure}`);

            try {
                // Split the MusicXML to include only measures for this page
                const splitXml = splitMusicXmlByMeasures(originalMusicXml, measureRange.startMeasure, measureRange.endMeasure);

                if (!splitXml) {
                    console.error("OSMD: Failed to split MusicXML");
                    return;
                }

                // Reload OSMD with the split document
                await osmd.load(splitXml);

                // Re-apply options (but skip re-detection to avoid infinite loop)
                setOptions({}, true);

                console.log(`OSMD: Successfully rendered page ${pageNumber}`);

            } catch (error) {
                console.error(`OSMD: Error rendering page ${pageNumber}:`, error);
                showError(`Failed to render page ${pageNumber}: ` + error.message);
            }
        }

        // Navigate to a specific measure
        function goToMeasure(measureNumber) {
            if (!osmd || !osmd.Sheet) return;
            if (osmd.cursor) {
                osmd.cursor.show();
                for (let i = 0; i < measureNumber - 1; i++) {
                    osmd.cursor.next();
                }
            }
        }

        // Clear the current score
        function clear() {
            if (osmd) {
                osmd.clear();
            }
            hideError();
        }

        // UI helpers
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }

        // Communication with Flutter
        function sendToFlutter(eventType, data) {
            const message = JSON.stringify({ type: eventType, data: data });
            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(message);
            }
            console.log('Flutter message:', message);
        }

        // Handle messages from Flutter
        function handleFlutterMessage(message) {
            try {
                const parsed = typeof message === 'string' ? JSON.parse(message) : message;
                const { action, payload } = parsed;

                switch (action) {
                    case 'init':
                        initOSMD(payload || {});
                        break;
                    case 'load':
                        loadMusicXml(payload.xml);
                        break;
                    case 'loadUrl':
                        loadFromUrl(payload.url);
                        break;
                    case 'setOptions':
                        setOptions(payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'goToMeasure':
                        goToMeasure(payload.measure);
                        break;
                    case 'clear':
                        clear();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling Flutter message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        // Expose function globally for Flutter to call
        window.handleFlutterMessage = handleFlutterMessage;

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (osmd && osmd.Sheet) {
                    osmd.render();
                }
            }, 250);
        });
    </script>
</body>

</html>
