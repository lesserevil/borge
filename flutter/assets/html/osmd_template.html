<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicXML Renderer - Native Pagination</title>
    <script src="opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        #scroll-container {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #osmd-container {
            width: 100%;
            max-width: 100%;
        }

        /* Premium page styling */
        div[id^="osmdCanvasPage"] {
            background-color: white !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            border: 1px solid #e0e0e0 !important;
            margin-bottom: 20px !important;
            position: relative !important;
        }

        /* Annotation canvas overlay - sits on top of each OSMD page */
        .annotation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }

        .annotation-canvas.drawing-mode {
            pointer-events: auto;
            cursor: crosshair;
        }

        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="scroll-container">
        <div id="loading">
            <div class="spinner"></div>
        </div>
        <div id="osmd-container"></div>
    </div>

    <script>
        let osmd = null;
        let currentPage = 1;
        let totalPages = 1;
        let zoomLevel = 1.0;
        let isReady = false;

        // ── Annotation State ──────────────────────────────────────────
        let annotationEnabled = false;       // Drawing mode toggle
        let isDrawing = false;               // Currently drawing a stroke
        let currentStrokePoints = [];        // Points in the current stroke
        let annotationCanvases = new Map();  // pageIndex -> canvas element
        let storedAnnotations = new Map();   // pageIndex -> [{svgPath, measureNumber, x, y}, ...]
        let strokeColor = '#1A3A6B';
        let strokeWidth = 2.5;

        // ── Undo/Redo History Stack ───────────────────────────────────
        let undoStack = [];   // [{pageIndex, annotation}, ...]
        let redoStack = [];   // [{pageIndex, annotation}, ...]
        const MAX_HISTORY = 100;

        // ── Annotation Canvas Management ──────────────────────────────

        /** Create or retrieve an annotation canvas for a given OSMD page element */
        function getOrCreateAnnotationCanvas(pageDiv, pageIndex) {
            if (annotationCanvases.has(pageIndex)) {
                const existing = annotationCanvases.get(pageIndex);
                // Resize if dimensions changed
                if (existing.width !== pageDiv.clientWidth || existing.height !== pageDiv.clientHeight) {
                    existing.width = pageDiv.clientWidth;
                    existing.height = pageDiv.clientHeight;
                    redrawAnnotations(pageIndex);
                }
                return existing;
            }

            const canvas = document.createElement('canvas');
            canvas.className = 'annotation-canvas';
            canvas.width = pageDiv.clientWidth;
            canvas.height = pageDiv.clientHeight;

            if (annotationEnabled) {
                canvas.classList.add('drawing-mode');
            }

            // Pointer events
            canvas.addEventListener('pointerdown', (e) => onPointerDown(e, pageIndex));
            canvas.addEventListener('pointermove', (e) => onPointerMove(e, pageIndex));
            canvas.addEventListener('pointerup', (e) => onPointerUp(e, pageIndex));
            canvas.addEventListener('pointercancel', (e) => onPointerUp(e, pageIndex));

            pageDiv.appendChild(canvas);
            annotationCanvases.set(pageIndex, canvas);
            return canvas;
        }

        /** Create annotation canvases for all rendered OSMD pages */
        function setupAnnotationCanvases() {
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');

            // Purge stale canvas refs (DOM elements destroyed by OSMD re-render)
            for (const [idx, canvas] of annotationCanvases) {
                if (!canvas.parentElement || !document.contains(canvas)) {
                    annotationCanvases.delete(idx);
                }
            }

            pages.forEach((pageDiv, index) => {
                getOrCreateAnnotationCanvas(pageDiv, index);
            });

            // Redraw stored annotations
            for (const [pageIndex] of storedAnnotations) {
                redrawAnnotations(pageIndex);
            }
        }

        /**
         * Convert all annotations still in 'pixel' coord system to 'measure' coords.
         * Called once when exiting drawing mode.
         */
        function convertAnnotationsToMeasureRelative() {
            for (const [pageIndex, annotations] of storedAnnotations) {
                for (const ann of annotations) {
                    if (ann.coordSystem === 'measure') continue; // already converted

                    const mBBox = getMeasureBBox(ann.measureNumber, pageIndex);
                    if (!mBBox || mBBox.w <= 0 || mBBox.h <= 0) continue; // can't convert, leave as pixel

                    // Parse the pixel-space SVG path
                    const pixelPoints = svgPathToPoints(ann.svgPath);
                    if (pixelPoints.length < 2) continue;

                    // Convert each point to measure-relative (0-1 within measure bbox)
                    const relPoints = pixelPoints.map(p => ({
                        x: (p.x - mBBox.x) / mBBox.w,
                        y: (p.y - mBBox.y) / mBBox.h,
                    }));

                    // Use higher precision for normalized coords
                    ann.svgPath = pointsToSvgPathPrecise(relPoints);
                    ann.coordSystem = 'measure';

                    // Also update the midpoint x/y to measure-relative
                    const mid = relPoints[Math.floor(relPoints.length / 2)];
                    ann.x = mid.x;
                    ann.y = mid.y;
                }
            }
        }

        /** Toggle drawing mode on all annotation canvases */
        function setAnnotationMode(enabled) {
            annotationEnabled = enabled;
            for (const [, canvas] of annotationCanvases) {
                if (enabled) {
                    canvas.classList.add('drawing-mode');
                } else {
                    canvas.classList.remove('drawing-mode');
                }
            }

            // When exiting drawing mode, convert all pixel-space annotations
            // to measure-relative coordinates for zoom/reflow resilience.
            if (!enabled) {
                convertAnnotationsToMeasureRelative();
            }

            sendToFlutter('annotationModeChanged', { enabled: annotationEnabled });
        }

        /** Set stroke style for drawing */
        function setAnnotationStyle(color, width) {
            if (color) strokeColor = color;
            if (width) strokeWidth = width;
        }

        // ── Pointer Event Handlers ────────────────────────────────────

        function onPointerDown(e, pageIndex) {
            if (!annotationEnabled) return;
            e.preventDefault();
            isDrawing = true;

            const canvas = annotationCanvases.get(pageIndex);
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            currentStrokePoints = [{ x, y }];

            // Start drawing preview
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function onPointerMove(e, pageIndex) {
            if (!isDrawing || !annotationEnabled) return;
            e.preventDefault();

            const canvas = annotationCanvases.get(pageIndex);
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            currentStrokePoints.push({ x, y });

            // Draw line segment preview
            const ctx = canvas.getContext('2d');
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function onPointerUp(e, pageIndex) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;

            // Need at least 2 points for a stroke
            if (currentStrokePoints.length < 2) {
                currentStrokePoints = [];
                return;
            }

            const canvas = annotationCanvases.get(pageIndex);

            // Generate SVG path from points
            const svgPath = pointsToSvgPath(currentStrokePoints);

            // Find which measure this stroke is closest to
            const midPoint = currentStrokePoints[Math.floor(currentStrokePoints.length / 2)];
            const measureInfo = findMeasureAtPoint(midPoint.x, midPoint.y, pageIndex);

            // Normalize coordinates relative to canvas size
            const normX = midPoint.x / canvas.width;
            const normY = midPoint.y / canvas.height;

            // Store the annotation
            const annotation = {
                svgPath,
                measureNumber: measureInfo.measureNumber,
                x: normX,
                y: normY,
                color: strokeColor,
                width: strokeWidth,
                // Starts as pixel coords; converted to measure-relative on exit drawing mode
                coordSystem: 'pixel',
                origWidth: canvas.width,
                origHeight: canvas.height,
            };

            if (!storedAnnotations.has(pageIndex)) {
                storedAnnotations.set(pageIndex, []);
            }
            storedAnnotations.get(pageIndex).push(annotation);

            // Push to undo stack
            pushToUndoStack(pageIndex, annotation);

            // Notify Flutter of the new annotation
            sendToFlutter('annotationAdded', {
                pageIndex,
                measureNumber: measureInfo.measureNumber,
                svgPath,
                x: normX,
                y: normY,
                color: strokeColor,
                width: strokeWidth,
            });

            currentStrokePoints = [];

            // Redraw cleanly (remove preview artifacts)
            redrawAnnotations(pageIndex);
        }

        // ── SVG Path Generation ───────────────────────────────────────

        /** Convert an array of {x, y} points to an SVG path string (pixel coords) */
        function pointsToSvgPath(points) {
            if (points.length === 0) return '';
            let path = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 1; i < points.length; i++) {
                path += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
            }
            return path;
        }

        /**
         * Like pointsToSvgPath but with higher decimal precision for normalized coords.
         */
        function pointsToSvgPathPrecise(points) {
            if (points.length === 0) return '';
            let path = `M ${points[0].x.toFixed(4)} ${points[0].y.toFixed(4)}`;
            for (let i = 1; i < points.length; i++) {
                path += ` L ${points[i].x.toFixed(4)} ${points[i].y.toFixed(4)}`;
            }
            return path;
        }

        /** Parse an SVG path string back to an array of {x, y} points */
        function svgPathToPoints(svgPath) {
            const points = [];
            const commands = svgPath.match(/[ML]\s*-?[\d.]+\s+-?[\d.]+/g);
            if (!commands) return points;
            for (const cmd of commands) {
                const nums = cmd.match(/-?[\d.]+/g);
                if (nums && nums.length >= 2) {
                    points.push({ x: parseFloat(nums[0]), y: parseFloat(nums[1]) });
                }
            }
            return points;
        }

        // ── Measure Coordinate Tracking (DOM-based) ─────────────────────

        /**
         * Get the bounding box of a measure in pixel coordinates
         * relative to its page div container.
         * Uses the DOM: .vf-measure elements with id matching the measure number.
         * Adds padding to capture annotations drawn near measure edges.
         * Returns {x, y, w, h} or null if not found.
         */
        function getMeasureBBox(measureNumber, pageIndex) {
            const pageDiv = document.querySelectorAll('div[id^="osmdCanvasPage"]')[pageIndex];
            if (!pageDiv) return null;

            // OSMD renders .vf-measure elements with id = measure number
            const measureEl = pageDiv.querySelector(`.vf-measure[id="${measureNumber}"]`);
            if (!measureEl) return null;

            const measureRect = measureEl.getBoundingClientRect();
            const pageRect = pageDiv.getBoundingClientRect();

            // Expand bbox by 25% on each side so edge annotations stay in 0-1 range
            const padX = measureRect.width * 0.25;
            const padY = measureRect.height * 0.25;

            return {
                x: (measureRect.left - pageRect.left) - padX,
                y: (measureRect.top - pageRect.top) - padY,
                w: measureRect.width + padX * 2,
                h: measureRect.height + padY * 2,
            };
        }

        /**
         * Find which measure is closest to a point (in page-div-relative pixel coords).
         */
        function findMeasureAtPoint(px, py, pageIndex) {
            const pageDiv = document.querySelectorAll('div[id^="osmdCanvasPage"]')[pageIndex];
            if (!pageDiv) return { measureNumber: 1 };

            const measures = pageDiv.querySelectorAll('.vf-measure');
            if (!measures.length) return { measureNumber: 1 };

            const pageRect = pageDiv.getBoundingClientRect();
            let closestMeasure = 1;
            let closestDistance = Infinity;

            for (const el of measures) {
                const rect = el.getBoundingClientRect();
                const cx = (rect.left + rect.width / 2) - pageRect.left;
                const cy = (rect.top + rect.height / 2) - pageRect.top;

                const dist = Math.sqrt((px - cx) ** 2 + (py - cy) ** 2);
                if (dist < closestDistance) {
                    closestDistance = dist;
                    closestMeasure = parseInt(el.id, 10) || 1;
                }
            }

            return { measureNumber: closestMeasure };
        }

        // ── Annotation Rendering ──────────────────────────────────────

        /** Redraw all stored annotations for a given page */
        function redrawAnnotations(pageIndex) {
            const canvas = annotationCanvases.get(pageIndex);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const annotations = storedAnnotations.get(pageIndex);
            if (!annotations) return;

            for (const ann of annotations) {
                if (ann.type === 'structured' && ann.kind && STRUCTURED_SYMBOLS[ann.kind]) {
                    // Structured annotation: render symbol at normalized position
                    const px = ann.x * canvas.width;
                    const py = ann.y * canvas.height;
                    STRUCTURED_SYMBOLS[ann.kind].render(ctx, px, py, ann.data || {});
                } else if (ann.svgPath) {
                    if (ann.coordSystem === 'measure') {
                        // Measure-relative: look up current measure position and scale
                        const mBBox = getMeasureBBox(ann.measureNumber, pageIndex);
                        if (mBBox) {
                            drawSvgPathMeasureRelative(ctx, ann.svgPath, strokeColor, ann.width || strokeWidth, mBBox);
                        }
                    } else {
                        // Pixel coords: scale proportionally from original canvas size
                        const scaleX = ann.origWidth ? canvas.width / ann.origWidth : 1;
                        const scaleY = ann.origHeight ? canvas.height / ann.origHeight : 1;
                        drawSvgPathScaled(ctx, ann.svgPath, strokeColor, ann.width || strokeWidth, scaleX, scaleY);
                    }
                }
            }
        }

        /** Draw an SVG path on a canvas context */
        function drawSvgPath(ctx, svgPath, color, width) {
            const points = svgPathToPoints(svgPath);
            if (points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        /**
         * Draw an SVG path with proportional scaling.
         * Points in the path are in original pixel coordinates;
         * scaleX/scaleY transform them to current canvas size.
         */
        function drawSvgPathScaled(ctx, svgPath, color, width, scaleX, scaleY) {
            const points = svgPathToPoints(svgPath);
            if (points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(points[0].x * scaleX, points[0].y * scaleY);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x * scaleX, points[i].y * scaleY);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        /**
         * Draw an SVG path stored in measure-relative coordinates.
         * Points are offsets within the measure bbox (0-1 range).
         * Scaled to the measure's current pixel position.
         */
        function drawSvgPathMeasureRelative(ctx, svgPath, color, width, mBBox) {
            const points = svgPathToPoints(svgPath);
            if (points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(mBBox.x + points[0].x * mBBox.w, mBBox.y + points[0].y * mBBox.h);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(mBBox.x + points[i].x * mBBox.w, mBBox.y + points[i].y * mBBox.h);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        /** Load annotations from Flutter (restore saved annotations) */
        function loadAnnotations(annotations) {
            // annotations: [{pageIndex, svgPath, measureNumber, x, y, color, width, coordSystem?}, ...]
            storedAnnotations.clear();
            for (const ann of annotations) {
                const pi = ann.pageIndex || 0;
                if (!storedAnnotations.has(pi)) {
                    storedAnnotations.set(pi, []);
                }
                storedAnnotations.get(pi).push(ann);
            }

            // Redraw all pages
            for (const [pi] of storedAnnotations) {
                redrawAnnotations(pi);
            }
        }

        /** Clear all annotations for a specific page or all pages */
        function clearAnnotations(pageIndex) {
            if (pageIndex !== undefined && pageIndex !== null) {
                storedAnnotations.delete(pageIndex);
                redrawAnnotations(pageIndex);
            } else {
                storedAnnotations.clear();
                for (const [pi] of annotationCanvases) {
                    redrawAnnotations(pi);
                }
            }
            sendToFlutter('annotationsCleared', { pageIndex: pageIndex ?? -1 });
        }

        /** Remove the last annotation from a page */
        function removeLastAnnotation(pageIndex) {
            const annotations = storedAnnotations.get(pageIndex);
            if (annotations && annotations.length > 0) {
                const removed = annotations.pop();
                redrawAnnotations(pageIndex);
                sendToFlutter('annotationRemoved', {
                    pageIndex,
                    measureNumber: removed.measureNumber,
                    remaining: annotations.length,
                });
            }
        }

        // ── Structured Annotation Symbols ─────────────────────────────

        /** Symbol definitions for structured annotations */
        const STRUCTURED_SYMBOLS = {
            fingerNumber: {
                render: (ctx, x, y, data) => {
                    const num = data.value || '1';
                    ctx.font = 'bold 16px serif';
                    ctx.fillStyle = data.color || '#0066CC';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, x, y);
                },
            },
            dynamicMark: {
                render: (ctx, x, y, data) => {
                    const mark = data.value || 'mf';
                    ctx.font = 'italic bold 14px serif';
                    ctx.fillStyle = data.color || '#CC0000';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(mark, x, y);
                },
            },
            bowing: {
                render: (ctx, x, y, data) => {
                    const type = data.value || 'down';
                    ctx.strokeStyle = data.color || '#333333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    if (type === 'down') {
                        // Down-bow: ∏ shape
                        ctx.moveTo(x - 8, y - 10);
                        ctx.lineTo(x - 8, y + 2);
                        ctx.lineTo(x + 8, y + 2);
                        ctx.lineTo(x + 8, y - 10);
                    } else {
                        // Up-bow: V shape
                        ctx.moveTo(x - 8, y + 6);
                        ctx.lineTo(x, y - 10);
                        ctx.lineTo(x + 8, y + 6);
                    }
                    ctx.stroke();
                },
            },
            articulation: {
                render: (ctx, x, y, data) => {
                    const type = data.value || 'staccato';
                    ctx.fillStyle = data.color || '#333333';
                    ctx.strokeStyle = data.color || '#333333';
                    ctx.lineWidth = 2;

                    switch (type) {
                        case 'staccato':
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        case 'accent':
                            ctx.beginPath();
                            ctx.moveTo(x - 8, y - 4);
                            ctx.lineTo(x + 8, y);
                            ctx.lineTo(x - 8, y + 4);
                            ctx.stroke();
                            break;
                        case 'tenuto':
                            ctx.beginPath();
                            ctx.moveTo(x - 8, y);
                            ctx.lineTo(x + 8, y);
                            ctx.stroke();
                            break;
                        case 'fermata':
                            ctx.beginPath();
                            ctx.arc(x, y - 2, 8, Math.PI, 0);
                            ctx.stroke();
                            ctx.beginPath();
                            ctx.arc(x, y - 2, 2, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        default:
                            // Default: small circle
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, Math.PI * 2);
                            ctx.fill();
                    }
                },
            },
        };

        /** Add a structured annotation symbol to a page */
        function addStructuredAnnotation(pageIndex, kind, measureNumber, normX, normY, data) {
            const canvas = annotationCanvases.get(pageIndex);
            if (!canvas) return;

            const annotation = {
                type: 'structured',
                kind,
                measureNumber,
                x: normX,
                y: normY,
                data: data || {},
                color: data?.color || strokeColor,
            };

            if (!storedAnnotations.has(pageIndex)) {
                storedAnnotations.set(pageIndex, []);
            }
            storedAnnotations.get(pageIndex).push(annotation);

            // Push to undo stack
            pushToUndoStack(pageIndex, annotation);

            redrawAnnotations(pageIndex);

            sendToFlutter('annotationAdded', {
                pageIndex,
                measureNumber,
                svgPath: '',
                x: normX,
                y: normY,
                color: annotation.color,
                width: 0,
                structured: true,
                kind,
                data,
            });
        }

        // ── Undo/Redo Functions ───────────────────────────────────────

        function pushToUndoStack(pageIndex, annotation) {
            undoStack.push({ pageIndex, annotation });
            if (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }
            redoStack = [];
            notifyHistoryState();
        }

        function undo() {
            if (undoStack.length === 0) return;

            const entry = undoStack.pop();
            const { pageIndex, annotation } = entry;

            const annotations = storedAnnotations.get(pageIndex);
            if (annotations) {
                const idx = annotations.indexOf(annotation);
                if (idx !== -1) {
                    annotations.splice(idx, 1);
                } else if (annotations.length > 0) {
                    annotations.pop();
                }
                redrawAnnotations(pageIndex);
            }

            redoStack.push(entry);
            notifyHistoryState();
            sendToFlutter('undoPerformed', { pageIndex, remaining: undoStack.length });
        }

        function redo() {
            if (redoStack.length === 0) return;

            const entry = redoStack.pop();
            const { pageIndex, annotation } = entry;

            if (!storedAnnotations.has(pageIndex)) {
                storedAnnotations.set(pageIndex, []);
            }
            storedAnnotations.get(pageIndex).push(annotation);
            redrawAnnotations(pageIndex);

            undoStack.push(entry);
            notifyHistoryState();
            sendToFlutter('redoPerformed', { pageIndex, remaining: redoStack.length });
        }

        function notifyHistoryState() {
            sendToFlutter('historyChanged', {
                canUndo: undoStack.length > 0,
                canRedo: redoStack.length > 0,
                undoCount: undoStack.length,
                redoCount: redoStack.length,
            });
        }

        async function init(options = {}) {
            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('osmd-container', {
                    autoResize: false,
                    backend: 'svg',
                    drawTitle: true,
                    drawComposer: true,
                    drawSubtitle: true,
                    ...options
                });

                isReady = true;
                hideLoading();
                sendToFlutter('ready', { success: true });
            } catch (error) {
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        async function loadMusicXml(xmlContent) {
            console.log('=== JS: loadMusicXml called, xmlContent type:', typeof xmlContent, 'length:', xmlContent?.length || xmlContent?.xml?.length || 'unknown');
            if (!isReady) return;

            showLoading();

            // Handle payload extraction
            if (xmlContent && typeof xmlContent === 'object' && xmlContent.xml) {
                xmlContent = xmlContent.xml;
            }

            try {
                await osmd.load(xmlContent);

                // DYNAMIC VIEWPORT-BASED PAGE FORMAT
                const container = document.getElementById('scroll-container');
                const containerWidth = container.clientWidth - 40;
                const containerHeight = container.clientHeight - 40;

                const pixelsToMm = (pixels) => pixels * 25.4 / 96;
                const pageWidthMm = pixelsToMm(containerWidth);
                const pageHeightMm = pixelsToMm(containerHeight);

                osmd.rules.PageFormat = new opensheetmusicdisplay.PageFormat(
                    pageWidthMm,
                    pageHeightMm,
                    "Viewport"
                );

                // Apply zoom
                osmd.zoom = zoomLevel;

                await osmd.render();

                // Count pages
                totalPages = osmd.GraphicSheet?.musicPages?.length || 1;
                const measureCount = osmd.Sheet?.SourceMeasures?.length || 0;

                hideLoading();

                const scoreInfo = {
                    title: osmd.Sheet?.TitleString || '',
                    composer: osmd.Sheet?.ComposerString || '',
                    subtitle: osmd.Sheet?.SubtitleString || ' ',
                    partCount: osmd.Sheet?.Parts?.length || 0,
                    measureCount: measureCount,
                    pageCount: totalPages,
                };

                scrollToPage(1);
                sendToFlutter('loaded', scoreInfo);

                // Set up annotation canvas overlays after render
                setupAnnotationCanvases();

            } catch (error) {
                hideLoading();
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        function scrollToPage(pageNum) {
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            if (pages.length === 0 || pageNum < 1 || pageNum > pages.length) return;

            const targetPage = pages[pageNum - 1];
            const container = document.getElementById('scroll-container');

            const containerRect = container.getBoundingClientRect();
            const pageRect = targetPage.getBoundingClientRect();
            const scrollTop = pageRect.top - containerRect.top + container.scrollTop;

            container.scrollTo({
                top: scrollTop,
                behavior: 'smooth'
            });

            currentPage = pageNum;
            sendToFlutter('pageChanged', { page: currentPage, total: totalPages });
        }

        function nextPage() {
            if (currentPage < totalPages) {
                scrollToPage(currentPage + 1);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                scrollToPage(currentPage - 1);
            }
        }

        function getFirstVisibleMeasure() {
            const pageIndex = (currentPage || 1) - 1;

            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return 1;
            }

            const page = osmd.GraphicSheet.musicPages[pageIndex];
            if (page && page.musicSystems && page.musicSystems.length > 0) {
                const system = page.musicSystems[0];
                if (system.graphicalMeasures && system.graphicalMeasures.length > 0) {
                    const measure = system.graphicalMeasures[0][0];
                    return measure.parentSourceMeasure?.measureNumber || 1;
                }
            }

            return 1;
        }

        function findPageWithMeasure(measureNumber) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return 1;
            }

            const pages = osmd.GraphicSheet.musicPages;

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                for (const system of page.musicSystems) {
                    for (const measureArray of system.graphicalMeasures) {
                        const m = measureArray[0];
                        const measureNum = m.parentSourceMeasure?.measureNumber;
                        if (measureNum === measureNumber) {
                            return i + 1;
                        }
                    }
                }
            }

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                for (const system of page.musicSystems) {
                    for (const measureArray of system.graphicalMeasures) {
                        const m = measureArray[0];
                        const measureNum = m.parentSourceMeasure?.measureNumber;
                        if (measureNum >= measureNumber) {
                            return i + 1;
                        }
                    }
                }
            }

            return pages.length;
        }


        async function setZoom(zoom) {
            if (!osmd || !osmd.Sheet || !osmd.Sheet.sourceData) return;

            const firstVisibleMeasure = getFirstVisibleMeasure();
            zoomLevel = Math.max(0.5, Math.min(2.0, zoom));

            await loadMusicXml(osmd.Sheet.sourceData);

            const targetPage = findPageWithMeasure(firstVisibleMeasure);
            scrollToPage(targetPage);
        }

        async function setPage(pageNumber) {
            scrollToPage(pageNumber);
        }

        function clear() {
            if (osmd) {
                osmd.clear();
            }
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function sendToFlutter(eventType, data) {
            const message = JSON.stringify({ type: eventType, data: data });
            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(message);
            }
            console.log('Flutter message:', message);
        }

        function handleFlutterMessage(message) {
            try {
                const parsed = typeof message === 'string' ? JSON.parse(message) : message;
                const { action, payload } = parsed;

                switch (action) {
                    case 'init':
                        init(payload || {});
                        break;
                    case 'load':
                        loadMusicXml(payload.xml || payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'nextPage':
                        nextPage();
                        break;
                    case 'prevPage':
                        prevPage();
                        break;
                    case 'clear':
                        clear();
                        break;
                    // ── Annotation Actions ──
                    case 'setAnnotationMode':
                        setAnnotationMode(payload.enabled);
                        break;
                    case 'setAnnotationStyle':
                        setAnnotationStyle(payload.color, payload.width);
                        break;
                    case 'loadAnnotations':
                        loadAnnotations(payload.annotations || []);
                        break;
                    case 'clearAnnotations':
                        clearAnnotations(payload.pageIndex);
                        break;
                    case 'removeLastAnnotation':
                        removeLastAnnotation(payload.pageIndex);
                        break;
                    case 'addStructuredAnnotation':
                        addStructuredAnnotation(
                            payload.pageIndex,
                            payload.kind,
                            payload.measureNumber,
                            payload.x,
                            payload.y,
                            payload.data
                        );
                        break;
                    case 'undo':
                        undo();
                        break;
                    case 'redo':
                        redo();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling Flutter message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        window.handleFlutterMessage = handleFlutterMessage;

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            console.log('🔄 Resize event fired');
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(async () => {
                console.log('🔄 Resize timeout executing');
                console.log('🔄 OSMD state:', {
                    osmd: !!osmd,
                    sheet: !!(osmd && osmd.Sheet),
                    sourceData: !!(osmd && osmd.Sheet && osmd.Sheet.sourceData)
                });

                if (!osmd || !osmd.Sheet || !osmd.Sheet.sourceData) {
                    console.log('❌ Resize blocked: OSMD not ready');
                    return;
                }

                console.log('✅ Starting resize re-render');
                const firstVisibleMeasure = getFirstVisibleMeasure();
                console.log('🔄 First visible measure:', firstVisibleMeasure);

                await loadMusicXml(osmd.Sheet.sourceData);
                console.log('✅ Resize re-render complete');

                const targetPage = findPageWithMeasure(firstVisibleMeasure);
                console.log('🔄 Scrolling to page:', targetPage);
                scrollToPage(targetPage);
            }, 500);
        });
    </script>
</body>

</html>
