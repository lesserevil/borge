<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicXML Renderer - Native Pagination</title>
    <script src="opensheetmusicdisplay.min.js"></script>
    <script src="osmd_annotations.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        #scroll-container {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #osmd-container {
            width: 100%;
            max-width: 100%;
        }

        /* Premium page styling */
        div[id^="osmdCanvasPage"] {
            background-color: white !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            border: 1px solid #e0e0e0 !important;
            margin-bottom: 20px !important;
            position: relative !important;
        }

        /* Annotation canvas overlay - sits on top of each OSMD page */
        .annotation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }

        .annotation-canvas.drawing-mode {
            pointer-events: auto;
            cursor: crosshair;
        }

        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="scroll-container">
        <div id="loading">
            <div class="spinner"></div>
        </div>
        <div id="osmd-container"></div>
    </div>

    <script>
        let osmd = null;
        let currentPage = 1;
        let totalPages = 1;
        let zoomLevel = 1.0;
        let isReady = false;

        // ── Platform-Specific Hooks for Annotation Module ─────────────

        sendToFlutter = function(eventType, data) {
            const message = JSON.stringify({ type: eventType, data: data });
            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(message);
            }
            console.log('Flutter message:', message);
        };

        getMeasureBBox = function(measureNumber, pageIndex) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return null;
            }
            const page = osmd.GraphicSheet.musicPages[pageIndex];
            if (!page || !page.musicSystems) return null;

            for (const system of page.musicSystems) {
                if (!system.graphicalMeasures) continue;
                for (const measureArray of system.graphicalMeasures) {
                    if (!measureArray || measureArray.length === 0) continue;
                    const gm = measureArray[0];
                    const num = gm.parentSourceMeasure?.measureNumber;
                    if (num !== measureNumber) continue;

                    const bbox = gm.boundingBox;
                    if (!bbox) continue;

                    const absPos = bbox.absolutePosition;
                    const size = bbox.size;
                    if (!absPos || !size) continue;

                    const pageDiv = document.querySelectorAll('div[id^="osmdCanvasPage"]')[pageIndex];
                    if (!pageDiv) return null;

                    const scale = (pageDiv.clientWidth / (page.pageWidth || pageDiv.clientWidth)) || 1;
                    return {
                        x: absPos.x * scale,
                        y: absPos.y * scale,
                        w: size.width * scale,
                        h: size.height * scale
                    };
                }
            }
            return null;
        };

        findMeasureAtPoint = function(px, py, pageIndex) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return { measureNumber: 1 };
            }

            const page = osmd.GraphicSheet.musicPages[pageIndex];
            if (!page || !page.musicSystems) {
                return { measureNumber: 1 };
            }

            const pageDiv = document.querySelectorAll('div[id^="osmdCanvasPage"]')[pageIndex];
            if (!pageDiv) return { measureNumber: 1 };

            let closestMeasure = 1;
            let closestDistance = Infinity;

            for (const system of page.musicSystems) {
                if (!system.graphicalMeasures) continue;
                for (const measureArray of system.graphicalMeasures) {
                    if (!measureArray || measureArray.length === 0) continue;
                    const gm = measureArray[0];
                    const bbox = gm.boundingBox;
                    if (!bbox) continue;

                    const absPos = bbox.absolutePosition;
                    const size = bbox.size;
                    if (!absPos || !size) continue;

                    const scale = (pageDiv.clientWidth / (page.pageWidth || pageDiv.clientWidth)) || 1;
                    const mx = absPos.x * scale;
                    const my = absPos.y * scale;
                    const mw = size.width * scale;
                    const mh = size.height * scale;

                    const cx = mx + mw / 2;
                    const cy = my + mh / 2;

                    const dist = Math.sqrt((px - cx) ** 2 + (py - cy) ** 2);
                    if (dist < closestDistance) {
                        closestDistance = dist;
                        closestMeasure = gm.parentSourceMeasure?.measureNumber || 1;
                    }
                }
            }

            return { measureNumber: closestMeasure };
        };

        async function init(options = {}) {
            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('osmd-container', {
                    autoResize: false,
                    backend: 'svg',
                    drawTitle: true,
                    drawComposer: true,
                    drawSubtitle: true,
                    ...options
                });

                isReady = true;
                hideLoading();
                sendToFlutter('ready', { success: true });
            } catch (error) {
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        async function loadMusicXml(xmlContent) {
            console.log('=== JS: loadMusicXml called, xmlContent type:', typeof xmlContent, 'length:', xmlContent?.length || xmlContent?.xml?.length || 'unknown');
            if (!isReady) return;

            showLoading();

            // Handle payload extraction
            if (xmlContent && typeof xmlContent === 'object' && xmlContent.xml) {
                xmlContent = xmlContent.xml;
            }

            try {
                await osmd.load(xmlContent);

                // DYNAMIC VIEWPORT-BASED PAGE FORMAT
                const container = document.getElementById('scroll-container');
                const containerWidth = container.clientWidth - 40;
                const containerHeight = container.clientHeight - 40;

                const pixelsToMm = (pixels) => pixels * 25.4 / 96;
                const pageWidthMm = pixelsToMm(containerWidth);
                const pageHeightMm = pixelsToMm(containerHeight);

                osmd.rules.PageFormat = new opensheetmusicdisplay.PageFormat(
                    pageWidthMm,
                    pageHeightMm,
                    "Viewport"
                );

                // Apply zoom
                osmd.zoom = zoomLevel;

                await osmd.render();

                // Count pages
                totalPages = osmd.GraphicSheet?.musicPages?.length || 1;
                const measureCount = osmd.Sheet?.SourceMeasures?.length || 0;

                hideLoading();

                const scoreInfo = {
                    title: osmd.Sheet?.TitleString || '',
                    composer: osmd.Sheet?.ComposerString || '',
                    subtitle: osmd.Sheet?.SubtitleString || ' ',
                    partCount: osmd.Sheet?.Parts?.length || 0,
                    measureCount: measureCount,
                    pageCount: totalPages,
                };

                scrollToPage(1);
                sendToFlutter('loaded', scoreInfo);

                // Set up annotation canvas overlays after render
                setupAnnotationCanvases();

            } catch (error) {
                hideLoading();
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        function scrollToPage(pageNum) {
            const pages = document.querySelectorAll('div[id^="osmdCanvasPage"]');
            if (pages.length === 0 || pageNum < 1 || pageNum > pages.length) return;

            const targetPage = pages[pageNum - 1];
            const container = document.getElementById('scroll-container');

            const containerRect = container.getBoundingClientRect();
            const pageRect = targetPage.getBoundingClientRect();
            const scrollTop = pageRect.top - containerRect.top + container.scrollTop;

            container.scrollTo({
                top: scrollTop,
                behavior: 'smooth'
            });

            currentPage = pageNum;
            sendToFlutter('pageChanged', { page: currentPage, total: totalPages });
        }

        function nextPage() {
            if (currentPage < totalPages) {
                scrollToPage(currentPage + 1);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                scrollToPage(currentPage - 1);
            }
        }

        function getFirstVisibleMeasure() {
            const pageIndex = (currentPage || 1) - 1;

            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return 1;
            }

            const page = osmd.GraphicSheet.musicPages[pageIndex];
            if (page && page.musicSystems && page.musicSystems.length > 0) {
                const system = page.musicSystems[0];
                if (system.graphicalMeasures && system.graphicalMeasures.length > 0) {
                    const measure = system.graphicalMeasures[0][0];
                    return measure.parentSourceMeasure?.measureNumber || 1;
                }
            }

            return 1;
        }

        function findPageWithMeasure(measureNumber) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.musicPages) {
                return 1;
            }

            const pages = osmd.GraphicSheet.musicPages;

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                for (const system of page.musicSystems) {
                    for (const measureArray of system.graphicalMeasures) {
                        const m = measureArray[0];
                        const measureNum = m.parentSourceMeasure?.measureNumber;
                        if (measureNum === measureNumber) {
                            return i + 1;
                        }
                    }
                }
            }

            for (let i = 0; i < pages.length; i++) {
                const page = pages[i];
                for (const system of page.musicSystems) {
                    for (const measureArray of system.graphicalMeasures) {
                        const m = measureArray[0];
                        const measureNum = m.parentSourceMeasure?.measureNumber;
                        if (measureNum >= measureNumber) {
                            return i + 1;
                        }
                    }
                }
            }

            return pages.length;
        }


        async function setZoom(zoom) {
            if (!osmd || !osmd.Sheet || !osmd.Sheet.sourceData) return;

            const firstVisibleMeasure = getFirstVisibleMeasure();
            zoomLevel = Math.max(0.4, Math.min(2.0, zoom));

            await loadMusicXml(osmd.Sheet.sourceData);

            const targetPage = findPageWithMeasure(firstVisibleMeasure);
            scrollToPage(targetPage);
        }

        async function setPage(pageNumber) {
            scrollToPage(pageNumber);
        }

        function clear() {
            if (osmd) {
                osmd.clear();
            }
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function handleFlutterMessage(message) {
            try {
                const parsed = typeof message === 'string' ? JSON.parse(message) : message;
                const { action, payload } = parsed;

                switch (action) {
                    case 'init':
                        init(payload || {});
                        break;
                    case 'load':
                        if (payload.zoom != null) {
                            zoomLevel = Math.max(0.4, Math.min(2.0, payload.zoom));
                        }
                        loadMusicXml(payload.xml || payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'nextPage':
                        nextPage();
                        break;
                    case 'prevPage':
                        prevPage();
                        break;
                    case 'clear':
                        clear();
                        break;
                    // ── Annotation Actions ──
                    case 'setAnnotationMode':
                        setAnnotationMode(payload.enabled);
                        break;
                    case 'setAnnotationStyle':
                        setAnnotationStyle(payload.color, payload.width);
                        break;
                    case 'loadAnnotations':
                        loadAnnotations(payload.annotations || []);
                        break;
                    case 'clearAnnotations':
                        clearAnnotations(payload.pageIndex);
                        break;
                    case 'removeLastAnnotation':
                        removeLastAnnotation(payload.pageIndex);
                        break;
                    case 'addStructuredAnnotation':
                        addStructuredAnnotation(
                            payload.pageIndex,
                            payload.kind,
                            payload.measureNumber,
                            payload.x,
                            payload.y,
                            payload.data
                        );
                        break;
                    case 'undo':
                        undoAnnotation();
                        break;
                    case 'redo':
                        redoAnnotation();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling Flutter message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        window.handleFlutterMessage = handleFlutterMessage;

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            console.log('🔄 Resize event fired');
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(async () => {
                console.log('🔄 Resize timeout executing');
                console.log('🔄 OSMD state:', {
                    osmd: !!osmd,
                    sheet: !!(osmd && osmd.Sheet),
                    sourceData: !!(osmd && osmd.Sheet && osmd.Sheet.sourceData)
                });

                if (!osmd || !osmd.Sheet || !osmd.Sheet.sourceData) {
                    console.log('❌ Resize blocked: OSMD not ready');
                    return;
                }

                console.log('✅ Starting resize re-render');
                const firstVisibleMeasure = getFirstVisibleMeasure();
                console.log('🔄 First visible measure:', firstVisibleMeasure);

                await loadMusicXml(osmd.Sheet.sourceData);
                console.log('✅ Resize re-render complete');

                const targetPage = findPageWithMeasure(firstVisibleMeasure);
                console.log('🔄 Scrolling to page:', targetPage);
                scrollToPage(targetPage);
            }, 500);
        });
    </script>
</body>

</html>
