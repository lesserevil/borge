<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicXML Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
        }

        #osmd-container {
            width: 100%;
            min-height: 100%;
        }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            padding: 20px;
            color: #c0392b;
            text-align: center;
        }

        #error.visible {
            display: block;
        }

        /* OSMD styling overrides */
        .osmd-container svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <span>Loading sheet music...</span>
        </div>
        <div id="error"></div>
        <div id="osmd-container"></div>
    </div>

    <script>
        // Global state
        let osmd = null;
        let isReady = false;
        let pendingMusicXml = null;

        // Configuration options
        const defaultOptions = {
            autoResize: true,
            drawTitle: true,
            drawSubtitle: true,
            drawComposer: true,
            drawLyricist: true,
            drawPartNames: true,
            drawPartAbbreviations: false,
            drawMeasureNumbers: true,
            drawMeasureNumbersOnlyAtSystemStart: true,
            drawTimeSignatures: true,
            drawMetronomeMarks: true,
            drawCredits: true,
            drawSlurs: true,
            drawFingerings: true,
            fingeringPosition: 'auto',
            followCursor: false,
            setWantedStemDirectionByXml: true,
            backend: 'svg',
            // Rendering quality
            renderSingleHorizontalStaffline: false,
            // Layout
            stretchLastSystemLine: false,
            // Pagination
            drawHiddenViews: false,
        };

        // Initialize OSMD
        async function initOSMD(options = {}) {
            const mergedOptions = { ...defaultOptions, ...options };

            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(
                    'osmd-container',
                    mergedOptions
                );

                isReady = true;
                hideLoading();

                // Process any pending MusicXML
                if (pendingMusicXml) {
                    await loadMusicXml(pendingMusicXml);
                    pendingMusicXml = null;
                }

                // If initial page is provided in options, go there
                if (mergedOptions.initialPage) {
                    setPage(mergedOptions.initialPage);
                }

                // Notify Flutter that OSMD is ready
                sendToFlutter('ready', { success: true });

            } catch (error) {
                showError('Failed to initialize OSMD: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        // Load MusicXML content (string or base64 mxl)
        async function loadMusicXml(xmlContent) {
            if (!isReady) {
                pendingMusicXml = xmlContent;
                return;
            }

            showLoading();
            hideError();

            try {
                // Check if it's base64 (likely MXL)
                const isBase64 = xmlContent.startsWith('data:') ||
                    (!xmlContent.startsWith('<') && xmlContent.length > 0 && !xmlContent.includes('\n'));

                if (isBase64 && !xmlContent.startsWith('data:')) {
                    // Assume it's an MXL if it doesn't look like XML text
                    // You might need to add Mime type if it's not present
                    // xmlContent = 'data:application/vnd.recordare.musicxml+xml;base64,' + xmlContent;
                }

                await osmd.load(xmlContent);
                osmd.render();
                hideLoading();

                // Send success and score info to Flutter
                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to render MusicXML: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        // Load MusicXML from URL
        async function loadFromUrl(url) {
            if (!isReady) {
                return;
            }

            showLoading();
            hideError();

            try {
                await osmd.load(url);
                osmd.render();
                hideLoading();

                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to load from URL: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'url' });
            }
        }

        // Get information about the loaded score
        function getScoreInfo() {
            if (!osmd || !osmd.Sheet) {
                return {};
            }

            const sheet = osmd.Sheet;
            let pageCount = 0;
            if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages) {
                pageCount = osmd.GraphicSheet.MusicPages.length;
            }

            return {
                title: sheet.TitleString || '',
                composer: sheet.ComposerString || '',
                subtitle: sheet.SubtitleString || '',
                partCount: sheet.Parts ? sheet.Parts.length : 0,
                measureCount: sheet.SourceMeasures ? sheet.SourceMeasures.length : 0,
                pageCount: pageCount,
            };
        }

        // Update rendering options
        function setOptions(options) {
            if (!osmd) return;

            Object.keys(options).forEach(key => {
                if (osmd.EngravingRules && key in osmd.EngravingRules) {
                    osmd.EngravingRules[key] = options[key];
                } else if (key in osmd) {
                    osmd[key] = options[key];
                }
            });

            // Re-render if already loaded
            if (osmd.Sheet) {
                osmd.render();
            }
        }

        // Set zoom level (1.0 = 100%)
        function setZoom(zoomLevel) {
            if (!osmd) return;

            osmd.Zoom = zoomLevel;
            if (osmd.Sheet) {
                osmd.render();
                // Send updated page info after zoom
                setTimeout(() => {
                    const scoreInfo = getScoreInfo();
                    sendToFlutter('loaded', scoreInfo);
                }, 100);
            }
        }

        // Set page number
        function setPage(pageNumber) {
            if (!osmd || !osmd.Sheet || !osmd.GraphicSheet) return;

            const pages = osmd.GraphicSheet.MusicPages;
            if (!pages || pages.length === 0) return;

            const clampedPage = Math.max(1, Math.min(pageNumber, pages.length));

            // OSMD horizontal paging is tricky. 
            // A simpler way for this template is to just scroll to the page.
            // But if we want true "one page at a time" matching Flutter's UI:

            const pageId = `page-container-${clampedPage}`;
            const element = document.getElementById(pageId);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Navigate to a specific measure
        function goToMeasure(measureNumber) {
            if (!osmd || !osmd.Sheet) return;

            // Find the measure and scroll to it
            const container = document.getElementById('container');
            const measureElements = document.querySelectorAll('[data-measure]');

            // OSMD doesn't have built-in measure navigation, so we use cursor
            if (osmd.cursor) {
                osmd.cursor.show();
                // Move cursor to measure (0-indexed internally)
                for (let i = 0; i < measureNumber - 1; i++) {
                    osmd.cursor.next();
                }
            }
        }

        // Highlight a specific note (for playback sync)
        function highlightNote(measureIndex, noteIndex) {
            // This would require cursor manipulation
            // For now, just use the cursor to show position
            if (osmd && osmd.cursor) {
                osmd.cursor.show();
            }
        }

        // Clear the current score
        function clear() {
            if (osmd) {
                osmd.clear();
            }
            hideError();
        }

        // UI helpers
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }

        // Communication with Flutter
        function sendToFlutter(eventType, data) {
            const message = JSON.stringify({ type: eventType, data: data });

            // For webview_flutter JavaScript channel
            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(message);
            }

            // Fallback for debugging in browser
            console.log('Flutter message:', message);
        }

        // Handle messages from Flutter
        function handleFlutterMessage(message) {
            try {
                const parsed = typeof message === 'string' ? JSON.parse(message) : message;
                const { action, payload } = parsed;

                switch (action) {
                    case 'init':
                        initOSMD(payload || {});
                        break;
                    case 'load':
                        loadMusicXml(payload.xml);
                        break;
                    case 'loadUrl':
                        loadFromUrl(payload.url);
                        break;
                    case 'setOptions':
                        setOptions(payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'goToMeasure':
                        goToMeasure(payload.measure);
                        break;
                    case 'clear':
                        clear();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling Flutter message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        // Expose function globally for Flutter to call
        window.handleFlutterMessage = handleFlutterMessage;

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (osmd && osmd.Sheet) {
                    osmd.render();
                }
            }, 250);
        });

        // Auto-initialize when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Don't auto-init; wait for Flutter to send init message
            // This allows Flutter to pass custom options
        });
    </script>
</body>

</html>
