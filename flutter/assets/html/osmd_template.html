<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MusicXML Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 40px;
            scroll-behavior: smooth;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #f8f9fa;
        }

        #osmd-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
        }

        /* Style the pages for a premium look */
        div[id^="osmdCanvasPage"] {
            background-color: white !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12) !important;
            border: 1px solid #e0e0e0 !important;
            margin: 0 40px !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0 !important;
        }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            padding: 20px;
            color: #c0392b;
            text-align: center;
        }

        #error.visible {
            display: block;
        }

        /* OSMD styling overrides */
        .osmd-container svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <span>Loading sheet music...</span>
        </div>
        <div id="error"></div>
        <div id="osmd-container"></div>
    </div>

    <script>
        // Global state
        let osmd = null;
        let isReady = false;
        let pendingMusicXml = null;

        // Configuration options
        const defaultOptions = {
            autoResize: true,
            drawTitle: true,
            drawSubtitle: true,
            drawComposer: true,
            drawLyricist: true,
            drawPartNames: true,
            drawPartAbbreviations: false,
            drawMeasureNumbers: true,
            drawMeasureNumbersOnlyAtSystemStart: true,
            drawTimeSignatures: true,
            drawMetronomeMarks: true,
            drawCredits: true,
            drawSlurs: true,
            drawFingerings: true,
            fingeringPosition: 'auto',
            followCursor: false,
            setWantedStemDirectionByXml: true,
            backend: 'svg',
            // Rendering quality
            renderSingleHorizontalStaffline: false,
            // Layout
            stretchLastSystemLine: false,
        };

        // Initialize OSMD
        async function initOSMD(options = {}) {
            const mergedOptions = { ...defaultOptions, ...options };

            try {
                osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(
                    'osmd-container',
                    mergedOptions
                );

                isReady = true;
                hideLoading();

                // Process any pending MusicXML
                if (pendingMusicXml) {
                    await loadMusicXml(pendingMusicXml);
                    pendingMusicXml = null;
                }

                // If initial page is provided in options, go there
                if (mergedOptions.initialPage) {
                    setPage(mergedOptions.initialPage);
                }

                // Notify Flutter that OSMD is ready
                sendToFlutter('ready', { success: true });

            } catch (error) {
                showError('Failed to initialize OSMD: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'init' });
            }
        }

        // Load MusicXML content (string or base64 mxl)
        async function loadMusicXml(xmlContent) {
            if (!isReady) {
                pendingMusicXml = xmlContent;
                return;
            }

            showLoading();
            hideError();

            console.log("OSMD: loadMusicXml called");

            // Handle cases where we might get the payload object instead of the string
            if (xmlContent && typeof xmlContent === 'object' && xmlContent.xml) {
                xmlContent = xmlContent.xml;
            } else if (xmlContent && typeof xmlContent === 'object') {
                if (xmlContent.payload && xmlContent.payload.xml) {
                    xmlContent = xmlContent.payload.xml;
                }
            }

            if (!isReady) {
                pendingMusicXml = xmlContent;
                return;
            }

            try {
                await osmd.load(xmlContent);

                // Re-apply options after loading to ensure pagination
                setOptions({});

                hideLoading();

                // Send success and score info to Flutter
                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to render MusicXML: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'load' });
            }
        }

        // Load MusicXML from URL
        async function loadFromUrl(url) {
            if (!isReady) {
                return;
            }

            showLoading();
            hideError();

            try {
                await osmd.load(url);
                osmd.render();
                hideLoading();

                const scoreInfo = getScoreInfo();
                sendToFlutter('loaded', scoreInfo);

            } catch (error) {
                hideLoading();
                showError('Failed to load from URL: ' + error.message);
                sendToFlutter('error', { message: error.message, type: 'url' });
            }
        }

        // Get information about the loaded score
        function getScoreInfo() {
            if (!osmd || !osmd.Sheet) {
                return {};
            }

            const sheet = osmd.Sheet;
            let pageCount = 0;

            if (osmd.GraphicSheet && osmd.GraphicSheet.MusicPages) {
                pageCount = osmd.GraphicSheet.MusicPages.length;
            }

            if (pageCount === 0 && osmd.Drawer && osmd.Drawer.Pages) {
                pageCount = osmd.Drawer.Pages.length;
            }

            return {
                title: sheet.TitleString || '',
                composer: sheet.ComposerString || '',
                subtitle: sheet.SubtitleString || '',
                partCount: sheet.Parts ? sheet.Parts.length : 0,
                measureCount: sheet.SourceMeasures ? sheet.SourceMeasures.length : 0,
                pageCount: pageCount || 1,
            };
        }

        // Update rendering options
        async function setOptions(options) {
            if (!osmd) return;

            const container = document.getElementById('osmd-container');

            // Width-retry logic
            let width = container.clientWidth;
            let retries = 5;
            while (width === 0 && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, 100));
                width = container.clientWidth;
                retries--;
            }

            // Force format and pagination
            osmd.setOptions({
                autoLayout: true,
                drawHiddenViews: false,
                ...options,
                pageFormat: "A5",
                verticalScrolling: false,
            });

            if (osmd.rules) {
                osmd.rules.VerticalScrolling = false;
                // Force discrete page breaks
                osmd.rules.PageHeight = 2100;
                osmd.rules.PageWidth = 1480;
            }

            if (osmd.Sheet) {
                osmd.render();

                // Allow time for DOM to populate
                setTimeout(() => {
                    const info = getScoreInfo();

                    // Detect if first page overflows and report it
                    const lastMeasure = detectLastFittingMeasure();
                    info.lastFittingMeasure = lastMeasure;

                    sendToFlutter('loaded', info);
                }, 500);
            }
        }

        // Detect the last measure that fits on the first page
        function detectLastFittingMeasure() {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.MusicPages.length) return -1;

            const page = osmd.GraphicSheet.MusicPages[0];
            const container = document.getElementById('container');
            const maxHeight = container.clientHeight - 80; // Account for padding

            let lastFittingMeasureIndex = -1;

            const osmdPageHeight = page.BoundingBox.BorderBottom;
            const canvasPage = document.querySelector('div[id^="osmdCanvasPage1"]');
            if (!canvasPage) return -1;
            const canvasHeight = canvasPage.clientHeight;
            const unitsToPixels = canvasHeight / osmdPageHeight;

            for (const system of page.MusicSystems) {
                const systemBottomUnits = system.BoundingBox.AbsolutePosition.y + system.BoundingBox.BorderBottom;
                const systemBottomPixels = systemBottomUnits * unitsToPixels;

                if (systemBottomPixels <= maxHeight) {
                    for (const staff of system.Staves) {
                        for (const measure of staff.Measures) {
                            // Use MeasureNumber (1-based) as fallback if parentSourceMeasure is missing
                            let idx = -1;
                            if (measure.parentSourceMeasure) {
                                idx = measure.parentSourceMeasure.measureListIndex;
                            } else {
                                idx = measure.MeasureNumber - 1;
                            }
                            lastFittingMeasureIndex = Math.max(lastFittingMeasureIndex, idx);
                        }
                    }
                } else {
                    break;
                }
            }

            // If we found nothing fitting, but there IS a system, maybe the first system is just huge?
            // In that case, we should at least show the first system (measure index 0 to ?)
            // But if lastFittingMeasureIndex is still -1, let's at least return the first measure of the system - 1 (so 0).
            // Actually, if nothing fits, the first page will be clipped, but we should still allow navigation.
            if (lastFittingMeasureIndex === -1 && page.MusicSystems.length > 0) {
                // Force at least one measure (or the first system's measures) to be "fitting" so we don't get stuck?
                // No, if it returns -1, Dart logic might fail.
                // Let's return the last measure of the first system, assuming the user can scroll a bit or it's just tight.
                const firstSystem = page.MusicSystems[0];
                for (const staff of firstSystem.Staves) {
                    for (const measure of staff.Measures) {
                        let idx = measure.MeasureNumber - 1;
                        lastFittingMeasureIndex = Math.max(lastFittingMeasureIndex, idx);
                    }
                }
            }

            return lastFittingMeasureIndex;
        }

        // Set zoom level (1.0 = 100%)
        function setZoom(zoomLevel) {
            if (!osmd) return;
            osmd.Zoom = zoomLevel;
            setOptions({});
        }

        // Set page number
        function setPage(pageNumber) {
            if (!osmd || !osmd.GraphicSheet || !osmd.GraphicSheet.MusicPages) return;

            const pageDiv = document.getElementById(`osmdCanvasPage${pageNumber}`);
            if (pageDiv) {
                const container = document.getElementById('container');
                if (!osmd.rules.VerticalScrolling) {
                    container.scrollLeft = pageDiv.offsetLeft - container.offsetLeft;
                } else {
                    container.scrollTop = pageDiv.offsetTop - container.offsetTop;
                }
            }
        }

        // Navigate to a specific measure
        function goToMeasure(measureNumber) {
            if (!osmd || !osmd.Sheet) return;
            if (osmd.cursor) {
                osmd.cursor.show();
                for (let i = 0; i < measureNumber - 1; i++) {
                    osmd.cursor.next();
                }
            }
        }

        // Clear the current score
        function clear() {
            if (osmd) {
                osmd.clear();
            }
            hideError();
        }

        // UI helpers
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }

        // Communication with Flutter
        function sendToFlutter(eventType, data) {
            const message = JSON.stringify({ type: eventType, data: data });
            if (window.FlutterChannel) {
                window.FlutterChannel.postMessage(message);
            }
            console.log('Flutter message:', message);
        }

        // Handle messages from Flutter
        function handleFlutterMessage(message) {
            try {
                const parsed = typeof message === 'string' ? JSON.parse(message) : message;
                const { action, payload } = parsed;

                switch (action) {
                    case 'init':
                        initOSMD(payload || {});
                        break;
                    case 'load':
                        loadMusicXml(payload.xml);
                        break;
                    case 'loadUrl':
                        loadFromUrl(payload.url);
                        break;
                    case 'setOptions':
                        setOptions(payload);
                        break;
                    case 'setZoom':
                        setZoom(payload.zoom);
                        break;
                    case 'setPage':
                        setPage(payload.page);
                        break;
                    case 'goToMeasure':
                        goToMeasure(payload.measure);
                        break;
                    case 'clear':
                        clear();
                        break;
                    default:
                        console.warn('Unknown action:', action);
                }
            } catch (error) {
                console.error('Error handling Flutter message:', error);
                sendToFlutter('error', { message: error.message, type: 'message' });
            }
        }

        // Expose function globally for Flutter to call
        window.handleFlutterMessage = handleFlutterMessage;

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (osmd && osmd.Sheet) {
                    osmd.render();
                }
            }, 250);
        });
    </script>
</body>

</html>
